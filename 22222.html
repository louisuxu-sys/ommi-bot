<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DEEPQUANT | Baccarat AI v4.5 Pro</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="m-0">
    <div class="flex h-screen bg-[#0b0e14] text-gray-200 overflow-hidden font-sans">
      <!-- 左側：遊戲畫面 (嵌入 DG) -->
      <div class="flex-1 flex flex-col border-r border-gray-800">
        <div class="h-12 bg-[#161b22] border-b border-gray-800 flex items-center px-4 justify-between">
          <div class="flex items-center gap-2">
            <i data-lucide="activity" class="text-blue-500 w-[18px] h-[18px]"></i>
            <span class="font-bold text-sm tracking-widest">LIVE DATA MONITOR</span>
          </div>
          <span class="text-xs text-gray-500">Target: dg66.net/live/baccarat</span>
        </div>

        <!-- 遊戲嵌入區 -->
        <div class="flex-1 bg-black relative">
          <iframe
            id="dg-frame"
            src="https://dg66.net/action/Opengame/freegame2.aspx"
            class="w-full h-full border-none shadow-2xl"
            title="DG Live View"
          ></iframe>

          <!-- 嵌入失敗的明顯提示與替代方案 -->
          <div
            id="iframe-fallback"
            class="hidden absolute inset-0 flex items-center justify-center bg-black/70"
          >
            <div class="text-center max-w-sm p-4">
              <div class="mb-3 text-yellow-300 font-bold">無法嵌入目標頁面</div>
              <p class="text-xs text-gray-300 mb-4">
                站台的安全性設定（Content-Security-Policy: frame-ancestors）限制在外部網域中以 iframe 顯示。
                請直接開啟原網址或洽站方開放嵌入權限。
              </p>
              <div class="flex items-center justify-center gap-2">
                <a
                  class="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded"
                  href="https://dg66.net/action/Opengame/freegame2.aspx"
                  target="_blank"
                  rel="noreferrer"
                >在新視窗開啟</a>
                <button
                  id="copy-url"
                  class="px-3 py-2 bg-gray-700 hover:bg-gray-600 text-white text-xs font-bold rounded"
                >複製網址</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 右側：AI 分析面板 -->
      <div class="w-[380px] bg-[#0d1117] flex flex-col shadow-2xl">
        <!-- 面板頭部 -->
        <div class="p-6 border-b border-gray-800">
          <div class="flex items-center gap-3 mb-2">
            <div class="p-2 bg-blue-600/20 rounded-lg">
              <i data-lucide="brain" class="text-blue-400 w-6 h-6"></i>
            </div>
            <div>
              <h2 class="text-lg font-black text-white leading-none">DEEPQUANT</h2>
              <p class="text-[10px] text-blue-500 font-mono">BACCARAT AI v4.5 Pro</p>
            </div>
          </div>
        </div>

        <!-- 數據分析區 -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
          <!-- 預測核心 -->
          <div class="bg-[#161b22] rounded-xl p-5 border border-gray-800">
            <h3 class="text-xs font-bold text-gray-500 mb-4 uppercase tracking-tighter">AI Prediction</h3>
            <div class="flex justify-around items-center text-center">
              <div>
                <p class="text-[10px] text-gray-400 uppercase">信心值</p>
                <p class="text-2xl font-black text-emerald-400">83.5%</p>
              </div>
              <div class="w-px h-10 bg-gray-800"></div>
              <div>
                <p class="text-[10px] text-gray-400 uppercase">建議選項</p>
                <p class="text-2xl font-black text-blue-400 underline decoration-2 underline-offset-4">閒 (P)</p>
              </div>
            </div>
          </div>

          <!-- 手動輸入模擬 (用來輸入你在左邊看到的牌) -->
          <div>
            <h3 class="text-xs font-bold text-gray-500 mb-3 uppercase tracking-widest">Input Recent Cards</h3>
            <div class="grid grid-cols-4 gap-2">
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">1</button>
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">2</button>
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">3</button>
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">4</button>
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">5</button>
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">6</button>
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">7</button>
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">8</button>
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">9</button>
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">10</button>
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">J</button>
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">Q</button>
              <button class="h-10 bg-[#21262d] hover:bg-blue-600 text-sm font-bold rounded-md border border-gray-700 transition-colors">K</button>
            </div>
          </div>

          <!-- 獲利回測小圖表 -->
          <div class="bg-gradient-to-br from-blue-900/10 to-transparent rounded-xl p-5 border border-blue-900/30">
            <div class="flex justify-between items-end mb-4">
              <h3 class="text-xs font-bold text-blue-400 uppercase tracking-widest flex items-center gap-1">
                <i data-lucide="trending-up" class="w-[14px] h-[14px]"></i>
                Cumulative Profit
              </h3>
              <span class="text-xs font-bold text-white">+1,240U</span>
            </div>
            <div class="h-16 w-full bg-[#0d1117] rounded flex items-end gap-1 px-1">
              <div class="flex-1 bg-blue-500/40 rounded-t-sm" style="height: 40%"></div>
              <div class="flex-1 bg-blue-500/40 rounded-t-sm" style="height: 70%"></div>
              <div class="flex-1 bg-blue-500/40 rounded-t-sm" style="height: 45%"></div>
              <div class="flex-1 bg-blue-500/40 rounded-t-sm" style="height: 90%"></div>
              <div class="flex-1 bg-blue-500/40 rounded-t-sm" style="height: 65%"></div>
              <div class="flex-1 bg-blue-500/40 rounded-t-sm" style="height: 80%"></div>
              <div class="flex-1 bg-blue-500/40 rounded-t-sm" style="height: 95%"></div>
              <div class="flex-1 bg-blue-500/40 rounded-t-sm" style="height: 100%"></div>
            </div>
          </div>
        </div>

        <!-- 底部按鈕 -->
        <div class="p-6 border-t border-gray-800 bg-[#161b22]">
          <button id="run-analysis" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl shadow-lg shadow-blue-900/20 transition-all flex items-center justify-center gap-2">
            <i data-lucide="settings" class="w-[18px] h-[18px]"></i>
            RUN REAL-TIME ANALYSIS
          </button>
        </div>
      </div>
    </div>

    <!-- Lucide icons (CDN, non-React) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // 初始化 Lucide 圖示
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }

        // 簡單的按鈕互動效果
        const runBtn = document.getElementById('run-analysis');
        if (runBtn) {
          runBtn.addEventListener('click', function () {
            runBtn.classList.add('animate-pulse');
            setTimeout(() => runBtn.classList.remove('animate-pulse'), 1500);
            console.log('[DEEPQUANT] RUN REAL-TIME ANALYSIS clicked');
          });
        }

        // 嘗試偵測 iframe 是否成功載入；若未載入則顯示替代面板
        const iframe = document.getElementById('dg-frame');
        const fallback = document.getElementById('iframe-fallback');
        let loaded = false;
        if (iframe) {
          iframe.addEventListener('load', function () {
            loaded = true;
            // 成功載入時，確保隱藏 fallback
            if (fallback) fallback.classList.add('hidden');
          });
          // 2 秒後仍未載入，顯示提示（注意：無法保證 100% 判斷，但可改善體驗）
          setTimeout(function () {
            if (!loaded && fallback) {
              fallback.classList.remove('hidden');
            }
          }, 2000);
        }

        // 複製網址到剪貼簿
        const copyBtn = document.getElementById('copy-url');
        if (copyBtn) {
          copyBtn.addEventListener('click', async function () {
            try {
              await navigator.clipboard.writeText('https://dg66.net/action/Opengame/freegame2.aspx');
              copyBtn.textContent = '已複製';
              setTimeout(() => (copyBtn.textContent = '複製網址'), 1500);
            } catch (e) {
              console.warn('Clipboard write failed:', e);
            }
          });
        }
      });
    </script>
  </body>
  </html>
