<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPORTIQ | 管理員後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body{margin:0;background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    ::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-track{background:#0d1117} ::-webkit-scrollbar-thumb{background:#2a2f38;border-radius:4px}
    .btn{padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;border-radius:8px;border:none;transition:all .15s}

    /* ===== Mobile RWD ===== */
    @media (max-width: 768px) {
      header { padding-left: 10px !important; padding-right: 10px !important; }
      .header-admin-user { display: none !important; }
      .main-content { padding-left: 10px !important; padding-right: 10px !important; padding-top: 12px !important; }
      .stat-grid { gap: 8px !important; }
      .stat-grid > div { padding: 10px 6px !important; }
      .stat-grid .text-2xl { font-size: 20px !important; }
      .add-form { flex-direction: column !important; }
      .add-form > div, .add-form > button { min-width: 100% !important; flex: none !important; }
      .add-form > button { margin-top: 4px; }
      .user-row { flex-direction: column !important; align-items: flex-start !important; gap: 8px !important; padding: 12px 10px !important; }
      .user-row .user-avatar { display: none !important; }
      .user-actions { width: 100% !important; flex-wrap: wrap !important; gap: 6px !important; }
      .user-actions .btn { flex: 1; min-width: 60px; text-align: center; }
      .pw-modal-box { width: 92vw !important; max-width: 92vw !important; margin: 8px; }
    }
    @media (max-width: 480px) {
      .stat-grid { grid-template-columns: 1fr 1fr 1fr !important; gap: 6px !important; }
      .stat-grid .text-2xl { font-size: 18px !important; }
      .user-info .text-sm { font-size: 12px !important; }
      .user-info .flex.items-center.gap-2 { flex-wrap: wrap; gap: 4px !important; }
    }
  </style>
</head>
<body>

<div class="min-h-screen flex flex-col">
  <!-- 頂部導航 -->
  <header style="background:#010409;border-bottom:1px solid #21262d" class="flex items-center justify-between px-5 h-12 flex-shrink-0">
    <div class="flex items-center gap-3">
      <span class="text-lg">🛡️</span>
      <span class="text-sm font-black text-white tracking-wider">SPORTIQ</span>
      <span class="text-[9px] font-mono text-purple-400 bg-purple-500/10 px-1.5 py-0.5 rounded">ADMIN</span>
    </div>
    <div class="flex items-center gap-3">
      <a href="sports-analysis.html" class="flex items-center gap-1 px-3 py-1 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 text-[11px] font-bold rounded-md border border-emerald-800/40 transition-all">
        <i data-lucide="arrow-left" class="w-3 h-3"></i> 返回比分頁
      </a>
      <span class="text-[10px] text-gray-500 header-admin-user" id="admin-user"></span>
      <button onclick="doLogout()" class="flex items-center gap-1 px-3 py-1 bg-red-600/10 hover:bg-red-600/20 text-red-400 text-[11px] font-bold rounded-md border border-red-800/30 transition-all">
        <i data-lucide="log-out" class="w-3 h-3"></i> 登出
      </button>
    </div>
  </header>

  <!-- 主內容 -->
  <div class="main-content flex-1 overflow-y-auto px-5 py-6 max-w-4xl mx-auto w-full">
    <!-- 統計卡片 -->
    <div class="stat-grid grid grid-cols-3 gap-4 mb-6">
      <div class="bg-[#161b22] rounded-xl border border-gray-800/60 p-4 text-center">
        <p class="text-[10px] text-gray-500 mb-1">總用戶</p>
        <p class="text-2xl font-black text-white" id="stat-total">0</p>
      </div>
      <div class="bg-[#161b22] rounded-xl border border-gray-800/60 p-4 text-center">
        <p class="text-[10px] text-gray-500 mb-1">已開通</p>
        <p class="text-2xl font-black text-emerald-400" id="stat-active">0</p>
      </div>
      <div class="bg-[#161b22] rounded-xl border border-gray-800/60 p-4 text-center">
        <p class="text-[10px] text-gray-500 mb-1">已停用</p>
        <p class="text-2xl font-black text-red-400" id="stat-inactive">0</p>
      </div>
    </div>

    <!-- 新增用戶 -->
    <div class="bg-[#161b22] rounded-xl border border-gray-800/60 p-5 mb-6">
      <h3 class="text-sm font-black text-white mb-4 flex items-center gap-2">
        <i data-lucide="user-plus" class="w-4 h-4 text-emerald-400"></i> 新增用戶
      </h3>
      <div class="add-form flex flex-wrap gap-3 items-end">
        <div class="flex-1 min-w-[140px]">
          <label class="text-[10px] text-gray-500 font-bold mb-1 block">帳號</label>
          <input id="new-username" type="text" placeholder="輸入帳號"
            class="w-full px-3 py-2 bg-[#0d1117] border border-gray-800 rounded-lg text-sm text-white placeholder-gray-600 focus:outline-none focus:border-emerald-600" />
        </div>
        <div class="flex-1 min-w-[140px]">
          <label class="text-[10px] text-gray-500 font-bold mb-1 block">密碼</label>
          <input id="new-password" type="text" placeholder="輸入密碼"
            class="w-full px-3 py-2 bg-[#0d1117] border border-gray-800 rounded-lg text-sm text-white placeholder-gray-600 focus:outline-none focus:border-emerald-600" />
        </div>
        <div class="min-w-[100px]">
          <label class="text-[10px] text-gray-500 font-bold mb-1 block">角色</label>
          <select id="new-role" class="w-full px-3 py-2 bg-[#0d1117] border border-gray-800 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-600">
            <option value="user">一般用戶</option>
            <option value="admin">管理員</option>
          </select>
        </div>
        <div class="flex-1 min-w-[140px]">
          <label class="text-[10px] text-gray-500 font-bold mb-1 block">備註</label>
          <input id="new-note" type="text" placeholder="選填"
            class="w-full px-3 py-2 bg-[#0d1117] border border-gray-800 rounded-lg text-sm text-white placeholder-gray-600 focus:outline-none focus:border-emerald-600" />
        </div>
        <button onclick="addUser()" class="btn bg-emerald-600 hover:bg-emerald-500 text-white px-6">
          新增
        </button>
      </div>
      <div id="add-msg" class="text-xs mt-2 hidden"></div>
    </div>

    <!-- 用戶列表 -->
    <div class="bg-[#161b22] rounded-xl border border-gray-800/60 overflow-hidden">
      <div class="px-5 py-3 border-b border-gray-800/60 flex items-center justify-between">
        <h3 class="text-sm font-black text-white flex items-center gap-2">
          <i data-lucide="users" class="w-4 h-4 text-blue-400"></i> 用戶列表
        </h3>
        <button onclick="loadUsers()" class="text-[10px] text-gray-500 hover:text-white transition-colors flex items-center gap-1">
          <i data-lucide="refresh-cw" class="w-3 h-3"></i> 刷新
        </button>
      </div>
      <div id="user-list" class="divide-y divide-gray-800/40">
        <div class="p-8 text-center text-gray-600 text-sm">載入中...</div>
      </div>
    </div>
  </div>
</div>

<!-- 修改密碼彈窗 -->
<div id="pw-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center" onclick="if(event.target===this)closePwModal()">
  <div class="pw-modal-box bg-[#161b22] border border-gray-700 rounded-xl w-[360px] p-6" onclick="event.stopPropagation()">
    <h3 class="text-sm font-black text-white mb-4">修改密碼</h3>
    <p class="text-xs text-gray-500 mb-3">用戶：<span id="pw-username" class="text-white font-bold"></span></p>
    <input id="pw-new" type="text" placeholder="輸入新密碼"
      class="w-full px-3 py-2 bg-[#0d1117] border border-gray-800 rounded-lg text-sm text-white placeholder-gray-600 focus:outline-none focus:border-emerald-600 mb-3" />
    <div id="pw-msg" class="text-xs mb-3 hidden"></div>
    <div class="flex gap-2">
      <button onclick="closePwModal()" class="btn bg-gray-700 hover:bg-gray-600 text-gray-300 flex-1">取消</button>
      <button onclick="submitPassword()" class="btn bg-emerald-600 hover:bg-emerald-500 text-white flex-1">確認修改</button>
    </div>
  </div>
</div>

<script>
const API = (() => {
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'http://localhost:3939';
  return 'https://ommi-bot.onrender.com';
})();

function getToken() { return localStorage.getItem('sportiq_token'); }
function getHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` };
}

function doLogout() {
  localStorage.removeItem('sportiq_token');
  localStorage.removeItem('sportiq_user');
  localStorage.removeItem('sportiq_role');
  location.href = 'sports-analysis.html';
}

// 檢查管理員權限
async function checkAdmin() {
  const token = getToken();
  if (!token) { location.href = 'sports-analysis.html'; return; }
  try {
    const r = await fetch(`${API}/api/verify`, { headers: { 'Authorization': `Bearer ${token}` } });
    if (!r.ok) { location.href = 'sports-analysis.html'; return; }
    const data = await r.json();
    if (data.role !== 'admin') { alert('需要管理員權限'); location.href = 'sports-analysis.html'; return; }
    document.getElementById('admin-user').textContent = `👤 ${data.username}`;
  } catch(e) { location.href = 'sports-analysis.html'; }
}

// 載入用戶列表
async function loadUsers() {
  try {
    const r = await fetch(`${API}/api/users`, { headers: getHeaders() });
    if (!r.ok) { alert('載入失敗'); return; }
    const data = await r.json();
    renderUsers(data.users);
  } catch(e) { alert('伺服器連線失敗'); }
}

function renderUsers(users) {
  const container = document.getElementById('user-list');
  // 統計
  document.getElementById('stat-total').textContent = users.length;
  document.getElementById('stat-active').textContent = users.filter(u => u.active).length;
  document.getElementById('stat-inactive').textContent = users.filter(u => !u.active).length;

  if (users.length === 0) {
    container.innerHTML = '<div class="p-8 text-center text-gray-600 text-sm">沒有用戶</div>';
    return;
  }

  container.innerHTML = users.map(u => `
    <div class="user-row flex items-center gap-4 px-5 py-3 hover:bg-[#1c2333] transition-colors">
      <div class="user-avatar w-8 h-8 rounded-full flex items-center justify-center text-sm font-black
        ${u.role === 'admin' ? 'bg-purple-600/20 text-purple-400 border border-purple-700/40' : 'bg-blue-600/20 text-blue-400 border border-blue-700/40'}">
        ${u.username.charAt(0).toUpperCase()}
      </div>
      <div class="user-info flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="text-sm font-bold text-white">${u.username}</span>
          <span class="text-[9px] px-1.5 py-0.5 rounded font-bold
            ${u.role === 'admin' ? 'bg-purple-600/20 text-purple-400 border border-purple-700/30' : 'bg-gray-700/40 text-gray-400 border border-gray-700/30'}">
            ${u.role === 'admin' ? '管理員' : '用戶'}
          </span>
          <span class="text-[9px] px-1.5 py-0.5 rounded font-bold
            ${u.active ? 'bg-emerald-600/20 text-emerald-400 border border-emerald-700/30' : 'bg-red-600/20 text-red-400 border border-red-700/30'}">
            ${u.active ? '✓ 已開通' : '✗ 已停用'}
          </span>
        </div>
        <div class="text-[10px] text-gray-600 mt-0.5">
          建立：${u.createdAt || '—'}${u.note ? ` · ${u.note}` : ''}
        </div>
      </div>
      <div class="user-actions flex items-center gap-2 flex-shrink-0">
        ${u.username !== 'admin' ? `
          <button onclick="toggleUser('${u.username}')" class="btn text-[10px] px-3 py-1.5
            ${u.active ? 'bg-red-600/10 text-red-400 border border-red-800/30 hover:bg-red-600/20' : 'bg-emerald-600/10 text-emerald-400 border border-emerald-800/30 hover:bg-emerald-600/20'}">
            ${u.active ? '停用' : '開通'}
          </button>
        ` : ''}
        <button onclick="openPwModal('${u.username}')" class="btn text-[10px] px-3 py-1.5 bg-amber-600/10 text-amber-400 border border-amber-800/30 hover:bg-amber-600/20">
          改密碼
        </button>
        ${u.username !== 'admin' ? `
          <button onclick="deleteUser('${u.username}')" class="btn text-[10px] px-3 py-1.5 bg-red-600/10 text-red-400 border border-red-800/30 hover:bg-red-600/20">
            刪除
          </button>
        ` : ''}
      </div>
    </div>
  `).join('');

  if (window.lucide) window.lucide.createIcons();
}

// 新增用戶
async function addUser() {
  const username = document.getElementById('new-username').value.trim();
  const password = document.getElementById('new-password').value;
  const role = document.getElementById('new-role').value;
  const note = document.getElementById('new-note').value.trim();
  const msgEl = document.getElementById('add-msg');

  if (!username || !password) {
    msgEl.textContent = '請填寫帳號和密碼'; msgEl.className = 'text-xs mt-2 text-red-400'; return;
  }
  if (password.length < 4) {
    msgEl.textContent = '密碼至少 4 個字元'; msgEl.className = 'text-xs mt-2 text-red-400'; return;
  }

  try {
    const r = await fetch(`${API}/api/users`, {
      method: 'POST', headers: getHeaders(),
      body: JSON.stringify({ username, password, role, note, active: true })
    });
    const data = await r.json();
    if (!r.ok) { msgEl.textContent = data.error; msgEl.className = 'text-xs mt-2 text-red-400'; return; }
    msgEl.textContent = `✓ ${data.message}`; msgEl.className = 'text-xs mt-2 text-emerald-400';
    document.getElementById('new-username').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('new-note').value = '';
    loadUsers();
  } catch(e) {
    msgEl.textContent = '伺服器連線失敗'; msgEl.className = 'text-xs mt-2 text-red-400';
  }
}

// 開通/停用
async function toggleUser(username) {
  try {
    const r = await fetch(`${API}/api/users/toggle`, {
      method: 'POST', headers: getHeaders(),
      body: JSON.stringify({ username })
    });
    const data = await r.json();
    if (!r.ok) { alert(data.error); return; }
    loadUsers();
  } catch(e) { alert('操作失敗'); }
}

// 刪除
async function deleteUser(username) {
  if (!confirm(`確定要刪除用戶「${username}」嗎？此操作無法復原。`)) return;
  try {
    const r = await fetch(`${API}/api/users/delete`, {
      method: 'POST', headers: getHeaders(),
      body: JSON.stringify({ username })
    });
    const data = await r.json();
    if (!r.ok) { alert(data.error); return; }
    loadUsers();
  } catch(e) { alert('操作失敗'); }
}

// 修改密碼彈窗
let pwTarget = '';
function openPwModal(username) {
  pwTarget = username;
  document.getElementById('pw-username').textContent = username;
  document.getElementById('pw-new').value = '';
  document.getElementById('pw-msg').classList.add('hidden');
  const modal = document.getElementById('pw-modal');
  modal.classList.remove('hidden'); modal.classList.add('flex');
}
function closePwModal() {
  const modal = document.getElementById('pw-modal');
  modal.classList.add('hidden'); modal.classList.remove('flex');
}
async function submitPassword() {
  const newPassword = document.getElementById('pw-new').value;
  const msgEl = document.getElementById('pw-msg');
  if (!newPassword || newPassword.length < 4) {
    msgEl.textContent = '密碼至少 4 個字元'; msgEl.className = 'text-xs mb-3 text-red-400'; return;
  }
  try {
    const r = await fetch(`${API}/api/users/password`, {
      method: 'POST', headers: getHeaders(),
      body: JSON.stringify({ username: pwTarget, newPassword })
    });
    const data = await r.json();
    if (!r.ok) { msgEl.textContent = data.error; msgEl.className = 'text-xs mb-3 text-red-400'; return; }
    msgEl.textContent = '✓ 密碼已更新'; msgEl.className = 'text-xs mb-3 text-emerald-400';
    setTimeout(closePwModal, 1000);
  } catch(e) {
    msgEl.textContent = '操作失敗'; msgEl.className = 'text-xs mb-3 text-red-400';
  }
}

// 初始化
document.addEventListener('DOMContentLoaded', async function() {
  if (window.lucide) window.lucide.createIcons();
  await checkAdmin();
  loadUsers();
});
</script>
</body>
</html>
