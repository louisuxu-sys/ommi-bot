<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新紀元 | 體育即時比分 · AI 分析</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
  // 防止檢視原始碼
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('keydown', e => {
    if (e.key === 'F12') { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) { e.preventDefault(); return false; }
    if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
    if (e.ctrlKey && (e.key === 'S' || e.key === 's')) { e.preventDefault(); return false; }
  });
  </script>
  <style>
    @keyframes slideIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pulse-glow { 0%,100%{box-shadow:0 0 6px rgba(16,185,129,.15)} 50%{box-shadow:0 0 16px rgba(16,185,129,.4)} }
    @keyframes liveDot { 0%,100%{opacity:1} 50%{opacity:.25} }
    @keyframes ticker-scroll { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
    .anim-slide { animation:slideIn .2s ease-out }
    .anim-glow { animation:pulse-glow 2s infinite }
    .live-dot { animation:liveDot 1s infinite }
    ::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-track{background:#141c2b} ::-webkit-scrollbar-thumb{background:#334155;border-radius:4px} ::-webkit-scrollbar-thumb:hover{background:#475569}
    /* Tailwind CDN fallback — 確保佈局在 CDN 載入前就能正常運作 */
    .h-screen{height:100vh}.min-h-screen{min-height:100vh}
    .flex{display:flex}.flex-1{flex:1 1 0%}.flex-col{flex-direction:column}.flex-shrink-0{flex-shrink:0}
    .overflow-hidden{overflow:hidden}.overflow-y-auto{overflow-y:auto}.overflow-x-auto{overflow-x:auto}
    .items-center{align-items:center}.justify-center{justify-content:center}.justify-between{justify-content:space-between}
    .gap-2{gap:0.5rem}.gap-3{gap:0.75rem}.gap-4{gap:1rem}.gap-6{gap:1.5rem}.gap-8{gap:2rem}
    .p-5{padding:1.25rem}.p-6{padding:1.5rem}.px-3{padding-left:0.75rem;padding-right:0.75rem}.px-6{padding-left:1.5rem;padding-right:1.5rem}.py-1{padding-top:0.25rem;padding-bottom:0.25rem}.py-2{padding-top:0.5rem;padding-bottom:0.5rem}.py-2\.5{padding-top:0.625rem;padding-bottom:0.625rem}
    .text-white{color:#fff}.text-sm{font-size:0.875rem;line-height:1.25rem}.text-xs{font-size:0.75rem;line-height:1rem}
    .font-bold{font-weight:700}.font-black{font-weight:900}
    .rounded-lg{border-radius:0.5rem}.rounded-md{border-radius:0.375rem}
    .w-full{width:100%}.hidden{display:none}.block{display:block}.inline-flex{display:inline-flex}
    .fixed{position:fixed}.relative{position:relative}.absolute{position:absolute}.sticky{position:sticky}
    .inset-0{inset:0}.top-0{top:0}.z-40{z-index:40}.z-50{z-index:50}
    .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .flex-wrap{flex-wrap:wrap}.space-y-4>:not([hidden])~:not([hidden]){margin-top:1rem}
    .text-center{text-align:center}.text-right{text-align:right}.text-left{text-align:left}
    .transition-all{transition-property:all;transition-timing-function:cubic-bezier(.4,0,.2,1);transition-duration:150ms}
    .mx-auto{margin-left:auto;margin-right:auto}.mx-4{margin-left:1rem;margin-right:1rem}.ml-auto{margin-left:auto}
    .mb-1{margin-bottom:0.25rem}.mb-3{margin-bottom:0.75rem}.mb-4{margin-bottom:1rem}.mb-8{margin-bottom:2rem}.mt-1{margin-top:0.25rem}.mt-3{margin-top:0.75rem}.mt-4{margin-top:1rem}
    .border{border-width:1px}.border-t{border-top-width:1px}
    .no-underline{text-decoration-line:none}.cursor-pointer{cursor:pointer}
    .animate-spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    body{margin:0;background:#141c2b;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .app-shell{display:flex;height:100vh;overflow:hidden}
    .app-right{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
    .app-scroll{flex:1;overflow-y:auto;padding:1.25rem;min-height:0}

    .sidebar{width:220px;background:#0f172a;border-right:1px solid #1e293b;display:flex;flex-direction:column;flex-shrink:0;height:100vh;z-index:40}
    .sidebar-header{padding:16px 20px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px}
    .sidebar-nav{flex:1;padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
    .sidebar-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;color:#94a3b8;background:transparent;border:none;cursor:pointer;transition:all .15s;text-align:left;width:100%}
    .sidebar-item:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
    .sidebar-item.active{background:rgba(59,130,246,.15);color:#60a5fa}
    .sidebar-item .s-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
    .wbc-hot{background:linear-gradient(135deg,rgba(234,88,12,.15),rgba(220,38,38,.1)) !important;border:1px solid rgba(249,115,22,.4) !important;position:relative;overflow:visible}
    .wbc-hot::before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(249,115,22,.12) 0%,transparent 60%);pointer-events:none;animation:wbc-glow 2s ease-in-out infinite}
    .wbc-hot:hover{background:linear-gradient(135deg,rgba(234,88,12,.25),rgba(220,38,38,.18)) !important;border-color:rgba(249,115,22,.6) !important}
    .wbc-hot.active{background:linear-gradient(135deg,rgba(234,88,12,.25),rgba(220,38,38,.15)) !important;border-color:rgba(249,115,22,.7) !important;color:#fb923c !important}
    .wbc-fire{margin-left:auto;font-size:14px;animation:wbc-flame 1s ease-in-out infinite alternate}
    @keyframes wbc-flame{0%{transform:scale(1) translateY(0);opacity:.8}50%{transform:scale(1.2) translateY(-2px);opacity:1}100%{transform:scale(1) translateY(0);opacity:.8}}
    @keyframes wbc-glow{0%,100%{opacity:.3}50%{opacity:.8}}
    .sidebar-footer{padding:12px 10px;border-top:1px solid #1e293b;display:flex;flex-direction:column;gap:4px}
    .sidebar-footer-btn{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;color:#94a3b8;background:transparent;border:none;cursor:pointer;transition:all .15s;text-decoration:none;width:100%}
    .sidebar-footer-btn:hover{background:rgba(255,255,255,.06);color:#e2e8f0}

    .topbar{background:#0f172a;border-bottom:1px solid #1e293b;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0;flex-grow:0}
    .ticker-wrap{flex:1;overflow:hidden;margin:0 16px;position:relative;height:28px}
    .ticker-content{display:inline-flex;gap:32px;white-space:nowrap;animation:ticker-scroll 18s linear infinite;align-items:center;height:100%}
    .ticker-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#94a3b8}
    .ticker-item .t-live{color:#ef4444;font-weight:800}
    .ticker-item .t-score{color:#fff;font-weight:800}

    .sub-nav{background:#141c2b;border-bottom:1px solid #1e293b;padding:10px 20px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
    .league-btn{padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border-radius:8px;border:1px solid #1e293b;background:#1e293b;color:#94a3b8;transition:all .15s}
    .league-btn:hover{border-color:#30363d;color:#c9d1d9}
    .league-btn.active{background:rgba(31,111,235,.12);border-color:#1f6feb;color:#58a6ff}
    .date-btn{padding:6px 16px;font-size:12px;font-weight:600;cursor:pointer;border-radius:8px;border:1px solid #1e293b;background:#1e293b;color:#94a3b8;transition:all .15s}
    .date-btn:hover{border-color:#30363d;color:#c9d1d9}
    .date-btn.active{background:#238636;border-color:#238636;color:#fff}
    .filter-chip{padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;border-radius:20px;border:1px solid #1e293b;background:#1e293b;color:#94a3b8;transition:all .15s}
    .filter-chip:hover{border-color:#30363d;color:#c9d1d9}
    .filter-chip.active{background:rgba(31,111,235,.12);border-color:#1f6feb;color:#58a6ff}

    .match-grid{display:flex;flex-direction:column;gap:16px}
    .league-section{display:flex;flex-direction:column;gap:0}
    .league-section.has-body .league-bar{border-radius:10px 10px 0 0}
    .league-section.collapsed-section .league-bar{border-radius:10px}
    .league-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#1e293b;border-radius:10px;border:1px solid #2d3748;cursor:pointer;user-select:none;transition:background .15s}
    .league-bar:hover{background:#253347}
    .league-bar .league-chevron{margin-left:auto;font-size:14px;color:#64748b;transition:transform .25s}
    .league-bar .league-chevron.collapsed{transform:rotate(-90deg)}
    .league-body{border:1px solid #2d3748;border-top:none;border-radius:0 0 10px 10px;background:#0f172a;overflow:hidden;padding-bottom:8px}
    .league-bar .league-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
    .league-bar .league-name{font-size:14px;font-weight:800;color:#e2e8f0}
    .league-bar .league-count{font-size:12px;font-weight:700;color:#94a3b8;background:#334155;padding:2px 8px;border-radius:10px;min-width:22px;text-align:center}
    .game-table{width:100%;border-collapse:separate;border-spacing:0;margin-top:0}
    .game-table thead th{font-size:11px;font-weight:700;color:#64748b;padding:6px 8px;text-align:center;border-bottom:1px solid #1e293b;white-space:nowrap}
    .game-table thead th:first-child{text-align:left;padding-left:16px}
    .game-table thead th.th-team{text-align:left;min-width:100px}
    .game-table tbody tr{cursor:pointer;transition:background .15s}
    .game-table tbody tr:hover{background:rgba(255,255,255,.03)}
    .game-table tbody tr.row-away td{padding:8px 8px 2px;border-top:1px solid #1e293b}
    .game-table tbody tr.row-home td{padding:2px 8px 8px}
    .game-table tbody td{font-size:12px;color:#cbd5e1;text-align:center;vertical-align:middle}
    .game-table tbody td:first-child{text-align:left;padding-left:16px}
    .game-table tbody td.td-team{text-align:left;font-weight:700;font-size:13px}
    .game-table tbody td.td-score{font-weight:900;font-size:15px;min-width:40px;text-align:center}
    .game-table tbody td.td-spread{font-size:12px;font-weight:700}
    .game-table .spread-val{color:#f59e0b}
    .game-table .pct-val{font-size:11px;color:#64748b}
    .game-table .odds-val{font-size:12px;color:#94a3b8}
    .game-table .ai-tip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;background:transparent}
    .game-table .ai-tip.tip-win{color:#34d399;border:1.5px solid #34d399}
    .game-table .ai-tip.tip-loss{color:#475569;border:1.5px solid #334155}
    .game-table .ai-tip.tip-pending{color:#34d399;border:1.5px solid #34d399}
    .game-table .ai-tip.tip-skip{color:#64748b;border:1.5px solid #334155}
    .game-table .result-circle{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:14px}
    .game-table .result-circle.pass{background:#34d399;color:#fff}
    .game-table .result-circle.fail{background:transparent;border:2px solid #334155;color:#334155}
    .game-table .result-circle.none{background:transparent;border:2px solid #1e293b;color:#1e293b}
    .game-table .time-cell{font-size:10px;color:#64748b;white-space:nowrap}
    .game-table .date-row td{padding:4px 16px;font-size:11px;color:#64748b;font-weight:600;background:rgba(0,0,0,.15)}
    .match-card{background:#1e293b;border:1px solid #334155;border-radius:12px;transition:all .2s;cursor:pointer;overflow:hidden}
    .match-card:hover{border-color:#475569;background:#263550;transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
    .match-card.expanded{border-color:rgba(59,130,246,.4);background:#1c2d4a}
    .match-card.live-card{border-color:rgba(239,68,68,.2)}
    .card-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(33,38,45,.5)}
    .card-teams{padding:12px 14px}
    .card-team{display:flex;align-items:center;justify-content:space-between;padding:5px 0}
    .card-team .team-info{display:flex;align-items:center;gap:8px}
    .card-team .team-score{font-size:20px;font-weight:900;min-width:30px;text-align:right}
    .card-footer{padding:8px 14px;border-top:1px solid rgba(33,38,45,.5);display:flex;align-items:center;justify-content:space-between}

    .q-score{min-width:28px;text-align:center;font-size:12px;padding:2px 4px;border-radius:4px}
    .match-row{background:#161b22;border:1px solid #21262d;border-radius:10px;transition:all .15s;cursor:pointer}
    .match-row:hover{border-color:#30363d;background:#1c2333}
    .match-row.expanded{border-color:rgba(31,111,235,.35);background:#131a27}

    .sidebar-toggle{display:none;background:none;border:none;color:#c9d1d9;cursor:pointer;padding:4px}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;backdrop-filter:blur(2px)}

    @media (max-width: 1200px) { .game-table{font-size:11px} .game-table tbody td.td-team{font-size:12px} }
    @media (max-width: 768px) {
      .sidebar{position:fixed;left:-240px;transition:left .3s ease;z-index:50;height:100vh}
      .sidebar.open{left:0}
      .sidebar-overlay.open{display:block}
      .sidebar-toggle{display:flex}
      .topbar{padding:0 12px}
      .sub-nav{padding:8px 12px}
      .match-grid{gap:8px}
      .main-content{padding:10px !important}
      .filter-row{flex-direction:column;gap:6px !important;align-items:stretch !important}
      .filter-chips{flex-wrap:wrap;gap:4px !important}
      .league-btn{padding:5px 10px;font-size:11px;white-space:nowrap}
      .date-btn{padding:5px 10px;font-size:11px;white-space:nowrap}
      .filter-chip{padding:4px 10px;font-size:10px;white-space:nowrap}
      #league-tabs{overflow-x:auto;flex-wrap:nowrap !important;-webkit-overflow-scrolling:touch}
      #league-tabs::-webkit-scrollbar{display:none}
      .expanded-panel{padding:10px 8px !important}
      .expanded-panel .grid-cols-3{gap:4px !important}
      .expanded-panel .grid-cols-3 > div{padding:8px 4px !important}
      .expanded-panel .grid-cols-3 .text-lg{font-size:14px !important}
      .expanded-panel button,.expanded-panel a{font-size:10px !important;padding:6px 8px !important}
      .ai-modal-box{width:95vw !important;max-width:95vw !important;margin:8px;border-radius:12px !important}
      .ai-modal-box .p-6{padding:12px !important}
      .ai-modal-box .px-6{padding-left:12px !important;padding-right:12px !important}
      .ai-modal-box .text-2xl{font-size:18px !important}
      .ai-modal-box .grid-cols-3{gap:4px !important}
      .ai-modal-box .grid-cols-3 > div{padding:8px 4px !important}
    }
    @media (max-width: 480px) {
      .card-team .team-score{font-size:16px}
      .card-teams{padding:10px 12px}
      .card-header{padding:8px 12px}
      .card-footer{padding:6px 12px}
      .team-name{font-size:12px !important}
    }
  </style>
</head>
<body>

<!-- ===== 登入/註冊頁面 ===== -->
<div id="login-overlay" class="fixed inset-0 z-[9999] flex items-center justify-center" style="background:linear-gradient(135deg,#0d1117 0%,#161b22 50%,#0d1117 100%)">
  <div class="w-full max-w-sm mx-4">
    <div class="text-center mb-8">
      <img src="/logo.png" alt="新紀元" style="width:64px;height:64px;object-fit:contain;margin:0 auto;display:block;border-radius:10px">
      <h1 style="font-size:22px;font-weight:900;color:#fff;letter-spacing:3px;margin-top:12px">新紀元</h1>
      <p class="text-xs text-gray-500 mt-1">體育即時比分 · AI 智能分析</p>
    </div>
    <!-- 登入/註冊切換 -->
    <div class="flex mb-4 bg-[#161b22] rounded-lg border border-gray-800/60 p-1">
      <button onclick="switchAuthMode('login')" id="auth-tab-login" class="flex-1 py-2 text-xs font-bold rounded-md transition-all bg-emerald-600 text-white">登入</button>
      <button onclick="switchAuthMode('register')" id="auth-tab-register" class="flex-1 py-2 text-xs font-bold rounded-md transition-all text-gray-500 hover:text-gray-300">註冊</button>
    </div>
    <div class="bg-[#161b22] rounded-xl border border-gray-800/60 p-6 space-y-4">
      <div>
        <label class="text-xs text-gray-500 font-bold mb-1.5 block">帳號</label>
        <input id="login-username" type="text" placeholder="請輸入帳號"
          class="w-full px-3 py-2.5 bg-[#0d1117] border border-gray-800 rounded-lg text-sm text-white placeholder-gray-600 focus:outline-none focus:border-emerald-600 transition-colors" />
      </div>
      <div>
        <label class="text-xs text-gray-500 font-bold mb-1.5 block">密碼</label>
        <input id="login-password" type="password" placeholder="請輸入密碼"
          class="w-full px-3 py-2.5 bg-[#0d1117] border border-gray-800 rounded-lg text-sm text-white placeholder-gray-600 focus:outline-none focus:border-emerald-600 transition-colors"
          onkeydown="if(event.key==='Enter') authMode==='login' ? doLogin() : doRegister()" />
      </div>
      <!-- 註冊額外欄位 -->
      <div id="register-fields" style="display:none">
        <label class="text-xs text-gray-500 font-bold mb-1.5 block">確認密碼</label>
        <input id="register-confirm" type="password" placeholder="再次輸入密碼"
          class="w-full px-3 py-2.5 bg-[#0d1117] border border-gray-800 rounded-lg text-sm text-white placeholder-gray-600 focus:outline-none focus:border-emerald-600 transition-colors"
          onkeydown="if(event.key==='Enter')doRegister()" />
      </div>
      <div id="login-error" class="text-xs font-bold hidden"></div>
      <button onclick="authMode==='login'?doLogin():doRegister()" id="login-btn"
        class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-lg transition-all">
        登入
      </button>
    </div>
    <p id="auth-hint" class="text-[10px] text-gray-700 text-center mt-4">還沒有帳號？點上方「註冊」</p>
  </div>
</div>

<div id="main-app" class="app-shell" style="display:none">

  <!-- ===== 側邊欄遮罩 (手機版) ===== -->
  <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <!-- ===== 左側導航欄 ===== -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <a href="#" onclick="switchSport('basketball');return false;" class="flex items-center gap-3 no-underline hover:opacity-80 transition-opacity">
        <img src="/logo.png" alt="新紀元" style="width:44px;height:44px;object-fit:contain;border-radius:8px">
        <div>
          <span style="font-size:18px;font-weight:900;color:#fff;letter-spacing:2px;display:block;line-height:1.2">新紀元</span>
          <span class="text-[10px] text-gray-500">AI 體育分析平台</span>
        </div>
      </a>
    </div>
    <nav class="sidebar-nav">
      <div class="text-[9px] font-bold text-gray-600 uppercase tracking-widest px-3 mb-1">運動賽事</div>
      <button onclick="switchSport('wbc');closeSidebarMobile()" id="tab-wbc" class="sidebar-item wbc-hot">
        <span class="s-icon"><img src="/logo/wcb.png" style="width:30px;height:30px;object-fit:contain"></span><span>經典賽</span><span class="wbc-fire">🔥</span>
      </button>
      <button onclick="switchSport('basketball');closeSidebarMobile()" id="tab-basketball" class="sidebar-item active">
        <span class="s-icon">🏀</span><span>籃球</span>
      </button>
      <button onclick="switchSport('baseball');closeSidebarMobile()" id="tab-baseball" class="sidebar-item">
        <span class="s-icon">⚾</span><span>棒球</span>
      </button>
      <button onclick="switchSport('soccer');closeSidebarMobile()" id="tab-soccer" class="sidebar-item">
        <span class="s-icon">⚽</span><span>足球</span>
      </button>
      <button onclick="switchSport('hockey');closeSidebarMobile()" id="tab-hockey" class="sidebar-item">
        <span class="s-icon">🏒</span><span>冰球</span>
      </button>
      <button onclick="switchSport('tennis');closeSidebarMobile()" id="tab-tennis" class="sidebar-item">
        <span class="s-icon">🎾</span><span>網球</span>
      </button>
      <div class="text-[9px] font-bold text-gray-600 uppercase tracking-widest px-3 mb-1 mt-6">管理工具</div>
      <a id="admin-link" href="admin-panel.html" style="display:none" class="sidebar-item no-underline">
        <span class="s-icon">🛡️</span><span>管理後台</span>

/* ========== 登入認證 ========== */
const AUTH_API = (() => {
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return `http://localhost:3939`;
  return 'https://ommi-bot.onrender.com';
})();

let currentUser = null;
let authMode = 'login'; // 'login' | 'register'

function switchAuthMode(mode) {
  authMode = mode;
  const errEl = document.getElementById('login-error');
  errEl.classList.add('hidden');
  const btn = document.getElementById('login-btn');
  const regFields = document.getElementById('register-fields');
  const tabLogin = document.getElementById('auth-tab-login');
  const tabReg = document.getElementById('auth-tab-register');
  const hint = document.getElementById('auth-hint');
  if (mode === 'register') {
    regFields.style.display = 'block';
    btn.textContent = '註冊';
    tabLogin.className = 'flex-1 py-2 text-xs font-bold rounded-md transition-all text-gray-500 hover:text-gray-300';
    tabReg.className = 'flex-1 py-2 text-xs font-bold rounded-md transition-all bg-blue-600 text-white';
    hint.textContent = '已有帳號？點上方「登入」';
  } else {
    regFields.style.display = 'none';
    btn.textContent = '登入';
    tabLogin.className = 'flex-1 py-2 text-xs font-bold rounded-md transition-all bg-emerald-600 text-white';
    tabReg.className = 'flex-1 py-2 text-xs font-bold rounded-md transition-all text-gray-500 hover:text-gray-300';
    hint.textContent = '還沒有帳號？點上方「註冊」';
  }
  btn.disabled = false;
}

async function doRegister() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const confirm = document.getElementById('register-confirm').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.className = 'text-xs font-bold text-red-400';
  if (!username || !password) { errEl.textContent = '請填寫帳號和密碼'; errEl.classList.remove('hidden'); return; }
  if (password !== confirm) { errEl.textContent = '兩次密碼不一致'; errEl.classList.remove('hidden'); return; }
  if (password.length < 4) { errEl.textContent = '密碼至少 4 個字元'; errEl.classList.remove('hidden'); return; }
  btn.textContent = '註冊中...'; btn.disabled = true;
  try {
    const r = await fetch(`${AUTH_API}/api/register`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await r.json();
    if (!r.ok) { errEl.textContent = data.error || '註冊失敗'; errEl.className = 'text-xs font-bold text-red-400'; errEl.classList.remove('hidden'); btn.textContent = '註冊'; btn.disabled = false; return; }
    // 註冊成功
    errEl.textContent = '✓ ' + data.message;
    errEl.className = 'text-xs font-bold text-emerald-400';
    errEl.classList.remove('hidden');
    btn.textContent = '註冊成功'; btn.disabled = true;
    // 2 秒後切回登入
    setTimeout(() => {
      switchAuthMode('login');
      document.getElementById('login-username').value = username;
      document.getElementById('login-password').value = '';
    }, 2000);
  } catch(e) {
    errEl.textContent = '伺服器連線失敗，請稍後再試'; errEl.className = 'text-xs font-bold text-red-400'; errEl.classList.remove('hidden');
    btn.textContent = '註冊'; btn.disabled = false;
  }
}

async function checkAuth() {
  const token = localStorage.getItem('sportiq_token');
  if (!token) { showLogin(); return; }
  try {
    const r = await fetch(`${AUTH_API}/api/verify`, { headers: { 'Authorization': `Bearer ${token}` } });
    if (!r.ok) { showLogin(); return; }
    const data = await r.json();
    currentUser = data;
    showApp();
  } catch(e) { showLogin(); }
}

async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  if (!username || !password) { errEl.textContent = '請輸入帳號和密碼'; errEl.classList.remove('hidden'); return; }
  btn.textContent = '登入中...'; btn.disabled = true;
  try {
    const r = await fetch(`${AUTH_API}/api/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await r.json();
    if (!r.ok) { errEl.textContent = data.error || '登入失敗'; errEl.classList.remove('hidden'); btn.textContent = '登入'; btn.disabled = false; return; }
    localStorage.setItem('sportiq_token', data.token);
    localStorage.setItem('sportiq_user', data.username);
    localStorage.setItem('sportiq_role', data.role);
    currentUser = { username: data.username, role: data.role };
    showApp();
  } catch(e) {
    errEl.textContent = '伺服器連線失敗，請稍後再試'; errEl.classList.remove('hidden');
    btn.textContent = '登入'; btn.disabled = false;
  }
}

function doLogout() {
  localStorage.removeItem('sportiq_token');
  localStorage.removeItem('sportiq_user');
  localStorage.removeItem('sportiq_role');
  currentUser = null;
  appInitialized = false;
  showLogin();
}

function showLogin() {
  document.getElementById('login-overlay').style.display = 'flex';
  document.getElementById('main-app').style.display = 'none'; document.getElementById('main-app').classList.remove('app-shell');
  switchAuthMode('login');
}

let appInitialized = false;
function showApp() {
  document.getElementById('login-overlay').style.display = 'none';
  const ma = document.getElementById('main-app'); ma.style.display = ''; ma.classList.add('app-shell');
  const ud = document.getElementById('user-display');
  if (ud && currentUser) ud.textContent = currentUser.username;
  const ua = document.getElementById('user-avatar');
  if (ua && currentUser) ua.textContent = currentUser.username.charAt(0).toUpperCase();
  const al = document.getElementById('admin-link');
  if (al) al.style.display = (currentUser && currentUser.role === 'admin') ? 'flex' : 'none';
  if (window.lucide) window.lucide.createIcons();
  if (!appInitialized) {
    appInitialized = true;
    renderDateTabs();
    fetchAllData();
    checkDateAvailability();
  }
}

function t(name) {
  if (!name) return '—';
  if (TEAM_NAME_MAP[name]) return TEAM_NAME_MAP[name];
  const cleaned = name.replace(/^(FC|CF|SC|AC|SS|AS|RC|SD|CD|CA|SE|CR|AD|UD)\s+/i, '').trim();
  if (TEAM_NAME_MAP[cleaned]) return TEAM_NAME_MAP[cleaned];
  for (const [en, zh] of Object.entries(TEAM_NAME_MAP)) {
    if (name.includes(en) || en.includes(name)) return zh;
  }
  return name;
}

/* ========== 工具函數 ========== */
function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
  return Math.abs(hash);
}

const WEEKDAYS = ['日','一','二','三','四','五','六'];
function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return `${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')} ${WEEKDAYS[dt.getDay()]}`;
}

// 靜默刷新：不顯示 loading spinner，不閃爍
async function silentRefresh() {
  const leagues = SPORT_LEAGUES[currentSport] || [];
  let psMatches = [];
  try {
    for (const l of leagues) {
      if (!isLeagueInSeason(l.psId, currentDate)) continue;
      try {
        const result = await fetchFromPlaysport(l.psId, currentDate);
        psMatches = psMatches.concat(result);
      } catch(e) {}
    }
  } catch(e) {}

  if (psMatches.length > 0) {
    allMatches = psMatches;
    dataSource = 'playsport';
  }
  const statusOrder = { live: 0, upcoming: 1, postponed: 2, finished: 3 };
  allMatches.sort((a, b) => {
    const sa = statusOrder[a.status] ?? 9, sb = statusOrder[b.status] ?? 9;
    if (sa !== sb) return sa - sb;
    const da = new Date(a.date + 'T' + (a.time || '00:00'));
    const db = new Date(b.date + 'T' + (b.time || '00:00'));
    return a.status === 'finished' ? db - da : da - db;
  });
  renderMatchList();
  updateTicker();
  console.log(`[SPORTIQ] 靜默刷新完成，${allMatches.length} 場賽事`);
}

/* ========== 渲染日期 Tab ========== */
function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// 日期可用性快取 { '2026-02-08': 10, '2026-02-10': 0 }
let dateAvailCache = {};

async function checkDateAvailability() {
  const now = new Date();
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
  const dates = [localDateStr(yesterday), localDateStr(now), localDateStr(tomorrow)];
  const gdList = dates.map(d => d.replace(/-/g, ''));

  // 用當前運動的第一個聯賽來檢查
  const leagues = SPORT_LEAGUES[currentSport] || [];
  if (leagues.length === 0) return;

  try {
    const resp = await fetch(`${LOCAL_PROXY}/check-dates?allianceid=${leagues[0].psId}&dates=${gdList.join(',')}`, { signal: AbortSignal.timeout(12000) });
    if (resp.ok) {
      const data = await resp.json();
      if (data.success && data.dates) {
        for (const [gd, count] of Object.entries(data.dates)) {
          const ds = `${gd.substring(0,4)}-${gd.substring(4,6)}-${gd.substring(6,8)}`;
          dateAvailCache[ds] = count;
        }
        renderDateTabs(); // 重新渲染日期按鈕
      }
    }
  } catch(e) { console.warn('[DateCheck] failed:', e.message); }
}

function renderDateTabs() {
  const now = new Date();
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  const tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);

  const yesterdayStr = localDateStr(yesterday);
  const todayStr = localDateStr(now);
  const tomorrowStr = localDateStr(tomorrow);

  const container = document.getElementById('date-tabs');
  let html = '';
  html += `<span class="text-[11px] text-gray-500 font-bold mr-1">時間</span>`;

  const dateBtns = [
    { date: yesterdayStr, label: fmtDate(yesterdayStr) },
    { date: todayStr, label: `今天 ${fmtDate(todayStr)}` },
    { date: tomorrowStr, label: fmtDate(tomorrowStr) },
  ];
  for (const btn of dateBtns) {
    const avail = dateAvailCache[btn.date];
    const noGames = avail === 0;
    const isActive = currentDate === btn.date;
    if (noGames && !isActive) {
      html += `<button class="date-btn opacity-40 cursor-not-allowed" disabled title="該日無賽事">${btn.label}</button>`;
    } else {
      html += `<button onclick="setDate('${btn.date}')" class="date-btn ${isActive ? 'active' : ''}">${btn.label}</button>`;
    }
  }

  container.innerHTML = html;
}

/* ========== 從 playsport.cc 爬取資料 ========== */
async function fetchFromPlaysport(psId, dateStr) {
  const gd = dateStr.replace(/-/g, '');
  const leagueName = getLeagueName(psId);

  // 優先使用本地 proxy（回傳已解析的 JSON）
  if (useLocalProxy) {
    try {
      const resp = await fetch(`${LOCAL_PROXY}/parse?allianceid=${psId}&gamedate=${gd}`, { signal: AbortSignal.timeout(18000) });
      if (resp.ok) {
        const data = await resp.json();
        if (data.success && data.games && data.games.length > 0) {
          // 日期+時間防護：未來日期或尚未開賽的比賽不可能是 live 或 finished
          const todayLocal = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
          const isFuture = dateStr > todayLocal;
          const isToday = dateStr === todayLocal;
          const nowMs = Date.now();
          return data.games.map(g => {
            let st = g.status || 'upcoming';
            let hs = g.homeScore, as = g.awayScore, qs = g.quarterScores || null;
            if (isFuture && (st === 'live' || st === 'finished')) {
              st = 'upcoming'; hs = null; as = null; qs = null;
            }
            // 今天的比賽：用比賽時間判斷是否真的已開始
            if (isToday && g.time && (st === 'live' || st === 'finished')) {
              const [hh, mmm] = g.time.split(':').map(Number);
              if (!isNaN(hh)) {
                const gameMs = new Date(`${dateStr}T${String(hh).padStart(2,'0')}:${String(mmm||0).padStart(2,'0')}:00`).getTime();
                if (nowMs < gameMs - 60000) {
                  st = 'upcoming'; hs = null; as = null; qs = null;
                }
              }
            }
            return {
              id: g.id,
              league: leagueName, leagueId: psId,
              home: g.home || '—', away: g.away || '—',
              homeScore: hs, awayScore: as,
              date: dateStr, time: g.time || '',
              status: st,
              venue: '—', round: '',
              homeBadge: '', awayBadge: '',
              quarterScores: qs,
              record: g.record || {}, odds: g.odds || {},
              teamCodes: g.teamCodes || '',
              raw: null, type: 'playsport', source: 'playsport'
            };
          });
        }
      }
    } catch(e) {
      console.warn('[LocalProxy] failed:', e.message);
      useLocalProxy = false; // 下次不再嘗試
    }
  }

  // 備援：CORS proxy + 前端 HTML 解析
  const url = `https://www.playsport.cc/livescore/${psId}?gamedate=${gd}&mode=2`;
  let html = null;
  for (let i = 0; i < CORS_PROXIES.length; i++) {
    const idx = (activeProxy + i) % CORS_PROXIES.length;
    const proxy = CORS_PROXIES[idx];
    const fullUrl = proxy.prefix + (proxy.encode ? encodeURIComponent(url) : url);
    try {
      const resp = await fetch(fullUrl, { signal: AbortSignal.timeout(15000) });
      if (resp.ok) {
        const text = await resp.text();
        if (text && text.length > 1000) { activeProxy = idx; html = text; break; }
      }
    } catch(e) { console.warn(`[CORSProxy ${idx}] failed:`, e.message); }
  }
  if (!html) return [];

  // 前端解析 HTML
  return parsePlaySportHTML(html, psId, gd, dateStr, leagueName);
}

/* ========== 前端 HTML 解析（備援用） ========== */
function parsePlaySportHTML(html, psId, gd, dateStr, leagueName) {
  const matches = [];

  // 從 select#gamebattle 取得賽事清單
  const optionRegex = /<option[^>]*value="([^"]*)"[^>]*>([^<]*)<\/option>/gi;
  const selectGames = [];
  let rm;
  while ((rm = optionRegex.exec(html)) !== null) {
    const val = rm[1], text = rm[2].trim();
    if (!val || val === '0' || !text.includes('vs')) continue;
    const parts = text.split(/\s*vs\s*/);
    if (parts.length === 2) {
      selectGames.push({ value: val, away: parts[0].trim(), home: parts[1].trim() });
    }
  }

  // 從 outer-gamebox 取得詳細資料
  const boxRegex = /id="outer-gamebox-(\d+)"[^>]*data-oid="([^"]*)"/g;
  const boxes = [];
  while ((rm = boxRegex.exec(html)) !== null) {
    boxes.push({ id: rm[1], oid: rm[2] });
  }

  for (const box of boxes) {
    let away = '', home = '', time = '';
    let record = {}, odds = {};
    const teamCodes = (box.oid.split('_')[2]) || '';

    // HTML 標籤清除
    const stripTags = (s) => s.replace(/<[^>]+>/g, '').trim();

    // 從 previewBox 取得隊名和時間
    const previewStart = html.indexOf(`id="gamebox-preview-${box.id}"`);
    if (previewStart > -1) {
      const previewEnd = html.indexOf('開打前的gamebox END', previewStart);
      const ph = previewEnd > -1 ? html.substring(previewStart, previewEnd) : html.substring(previewStart, previewStart + 15000);

      // 嘗試多種模式提取隊名
      const leftMatch = ph.match(/team_left[^>]*>[\s\S]*?<a[^>]*>\s*([\s\S]*?)\s*<\/a>/);
      const rightMatch = ph.match(/team_right[^>]*>[\s\S]*?<a[^>]*>\s*([\s\S]*?)\s*<\/a>/);
      const centerMatch = ph.match(/team_cinter[^>]*>\s*([^<]+)/);
      if (leftMatch) away = stripTags(leftMatch[1]);
      if (rightMatch) home = stripTags(rightMatch[1]);
      if (centerMatch) time = centerMatch[1].trim();

      // 備援：從 title 屬性取隊名（通常是完整名稱）
      const leftTitle = ph.match(/team_left[\s\S]*?title="([^"]+)"/);
      const rightTitle = ph.match(/team_right[\s\S]*?title="([^"]+)"/);
      if (leftTitle && stripTags(leftTitle[1]).length > away.length) away = stripTags(leftTitle[1]);
      if (rightTitle && stripTags(rightTitle[1]).length > home.length) home = stripTags(rightTitle[1]);

      // 備援：從 <a> 的 title 取隊名
      const leftATitle = ph.match(/team_left[\s\S]*?<a[^>]*title="([^"]+)"/);
      const rightATitle = ph.match(/team_right[\s\S]*?<a[^>]*title="([^"]+)"/);
      if (leftATitle && stripTags(leftATitle[1]).length > away.length) away = stripTags(leftATitle[1]);
      if (rightATitle && stripTags(rightATitle[1]).length > home.length) home = stripTags(rightATitle[1]);

      // 備援：從 img alt 取隊名
      const leftAlt = ph.match(/team_left[\s\S]*?alt="([^"]+)"/);
      const rightAlt = ph.match(/team_right[\s\S]*?alt="([^"]+)"/);
      if (leftAlt && stripTags(leftAlt[1]).length > away.length) away = stripTags(leftAlt[1]);
      if (rightAlt && stripTags(rightAlt[1]).length > home.length) home = stripTags(rightAlt[1]);

      // 戰績
      const extractStat = (label) => {
        const re = new RegExp(`datd_c[^>]*>\\s*${label}[\\s\\S]*?datd_l[^>]*>([\\s\\S]*?)<\\/td>[\\s\\S]*?datd_r[^>]*>([\\s\\S]*?)<\\/td>`);
        const m = ph.match(re);
        return m ? { left: m[1].replace(/<[^>]+>/g,'').replace(/詳細比分/g,'').trim(), right: m[2].replace(/<[^>]+>/g,'').replace(/詳細比分/g,'').trim() } : null;
      };
      const rec = extractStat('戰績'); if (rec) { record.awayRecord = rec.left; record.homeRecord = rec.right; }
      const recent = extractStat('近十場'); if (recent) { record.awayRecent = recent.left; record.homeRecent = recent.right; }
      const h2h = extractStat('對戰紀錄'); if (h2h) { record.awayH2H = h2h.left; record.homeH2H = h2h.right; }
      const avg = extractStat('平均得 \\/ 失分'); if (avg) { record.awayAvg = avg.left; record.homeAvg = avg.right; }
      const ha = extractStat('主 \\/ 客戰績'); if (ha) { record.awayHomeAway = ha.left; record.homeHomeAway = ha.right; }
    }

    // 讓分盤口
    const spreadMatch = html.match(new RegExp(`id="gamebox-[^"]*"[^>]*data-[^>]*outer-gamebox-${box.id}[\\s\\S]{0,2000}data-aheadprice="([^"]*)"[^>]*data-aheadodds="([^"]*)"`));
    // 更簡單：直接在 outer-gamebox 範圍內找
    const boxStart = html.indexOf(`id="outer-gamebox-${box.id}"`);
    const boxEnd = html.indexOf('</div><!--outer-gamebox-->', boxStart);
    if (boxStart > -1 && boxEnd > -1) {
      const boxHtml = html.substring(boxStart, boxEnd);
      const sp = boxHtml.match(/data-aheadprice="([^"]*)"/);
      const so = boxHtml.match(/data-aheadodds="([^"]*)"/);
      if (sp) odds.spread = sp[1];
      if (so) odds.spreadOdds = so[1];

      // 從 onBox / gamebox 取得隊名（總是嘗試，取較長的名稱）
      const nh = boxHtml.match(/data-nameh="([^"]*)"/);
      const na = boxHtml.match(/data-namea="([^"]*)"/);
      if (nh && stripTags(nh[1]).length > home.length) home = stripTags(nh[1]);
      if (na && stripTags(na[1]).length > away.length) away = stripTags(na[1]);

      // 從 gamebox 內的 title 或 alt 屬性取隊名
      const titleH = boxHtml.match(/team_right[\s\S]*?title="([^"]+)"/);
      const titleA = boxHtml.match(/team_left[\s\S]*?title="([^"]+)"/);
      if (titleH && stripTags(titleH[1]).length > home.length) home = stripTags(titleH[1]);
      if (titleA && stripTags(titleA[1]).length > away.length) away = stripTags(titleA[1]);

      // 時間備援
      if (!time) {
        const tm = boxHtml.match(/比賽時間[^]*?(\d{1,2}:\d{2})/);
        if (tm) time = tm[1];
      }
    }

    // 從完整 HTML 搜尋 data-nameh / data-namea（範圍更廣）
    const fullNameH = html.match(new RegExp(`outer-gamebox-${box.id}[\\s\\S]{0,5000}data-nameh="([^"]*)"`));
    const fullNameA = html.match(new RegExp(`outer-gamebox-${box.id}[\\s\\S]{0,5000}data-namea="([^"]*)"`));
    if (fullNameH && stripTags(fullNameH[1]).length > home.length) home = stripTags(fullNameH[1]);
    if (fullNameA && stripTags(fullNameA[1]).length > away.length) away = stripTags(fullNameA[1]);

    // 從 select 取得隊名（總是嘗試，取較長的名稱）
    const sg = selectGames.find(g => g.value === box.oid || g.value === box.id);
    if (sg) {
      if (sg.home && sg.home.length > home.length) home = sg.home;
      if (sg.away && sg.away.length > away.length) away = sg.away;
    }

    // 最後清理：確保沒有殘留 HTML
    home = stripTags(home);
    away = stripTags(away);

    if (away || home) {
      matches.push({
        id: `ps_${psId}_${gd}_${box.id}`,
        league: leagueName, leagueId: psId,
        home: home || '—', away: away || '—',
        homeScore: null, awayScore: null,
        date: dateStr, time,
        status: 'upcoming', venue: '—', round: '',
        homeBadge: '', awayBadge: '',
        quarterScores: null, record, odds, teamCodes,
        raw: null, type: 'playsport', source: 'playsport'
      });
    }
  }

  // 如果 gamebox 解析失敗，用 select 備援
  if (matches.length === 0) {
    selectGames.forEach((g, idx) => {
      matches.push({
        id: `ps_${psId}_${gd}_sel_${idx}`,
        league: leagueName, leagueId: psId,
        home: g.home, away: g.away,
        homeScore: null, awayScore: null,
        date: dateStr, time: '',
        status: 'upcoming', venue: '—', round: '',
        homeBadge: '', awayBadge: '',
        quarterScores: null, record: {}, odds: {},
        teamCodes: g.value.split('_')[2] || '',
        raw: null, type: 'playsport', source: 'playsport'
      });
    });
  }

  return matches;
}

function getLeagueName(psId) {
  for (const sport of Object.values(PS_LEAGUES)) {
    for (const l of sport) { if (l.psId === psId) return l.name; }
  }
  return '未知聯賽';
}

/* ========== TheSportsDB 備援 ========== */
async function fetchFromTSDB() {
  const leagues = TSDB_LEAGUES[currentSport] || [];
  const results = [];
  const fetches = [];
  for (const league of leagues) {
    fetches.push(
      fetch(`${TSDB_BASE}/eventspastleague.php?id=${league.id}`)
        .then(r => r.json()).then(data => ({ league, events: data.events || [], type: 'past' }))
        .catch(() => ({ league, events: [], type: 'past' }))
    );
    fetches.push(
      fetch(`${TSDB_BASE}/eventsnextleague.php?id=${league.id}`)
        .then(r => r.json()).then(data => ({ league, events: data.events || [], type: 'next' }))
        .catch(() => ({ league, events: [], type: 'next' }))
    );
  }
  const raw = await Promise.all(fetches);
  const seen = new Set();
  for (const result of raw) {
    for (const ev of result.events) {
      if (seen.has(ev.idEvent)) continue;
      seen.add(ev.idEvent);
      results.push({
        id: ev.idEvent, league: result.league.name, leagueId: result.league.id,
        home: ev.strHomeTeam || '—', away: ev.strAwayTeam || '—',
        homeScore: ev.intHomeScore, awayScore: ev.intAwayScore,
        date: ev.dateEvent || '', time: ev.strTime || '',
        status: getMatchStatusTSDB(ev, result.type),
        venue: ev.strVenue || '—', round: ev.intRound || '',
        homeBadge: ev.strHomeTeamBadge || '', awayBadge: ev.strAwayTeamBadge || '',
        quarterScores: null, raw: ev, type: result.type, source: 'tsdb'
      });
    }
  }
  return results;
}

function getMatchStatusTSDB(ev, type) {
  if (ev.strStatus === 'Match Finished' || ev.strStatus === 'FT' || type === 'past') return 'finished';
  if (ev.strStatus === 'Not Started' || ev.strStatus === 'NS' || type === 'next') return 'upcoming';
  if (ev.intHomeScore !== null && ev.intAwayScore !== null && ev.strStatus && ev.strStatus !== 'Match Finished') return 'live';
  return type === 'past' ? 'finished' : 'upcoming';
}

let dataSource = ''; // 'playsport' or 'tsdb'

async function fetchAllData(showLoading = true) {
  const leagues = SPORT_LEAGUES[currentSport] || [];
  allMatches = [];

  if (showLoading) {
    document.getElementById('match-list').innerHTML = `
      <div class="flex items-center justify-center py-12">
        <div class="text-center text-gray-600">
          <div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
          <p class="text-xs" id="fetch-status">正在讀取 ${leagues[0]?.name || ''} 資料...</p>
        </div>
      </div>`;
  }

  renderLeagueTabs();
  renderDateTabs();

  // 嘗試從 playsport.cc 爬取（逐一爬取，避免同時太多請求）
  let psMatches = [];
  let playsportReached = false; // 是否成功連線到 playsport（即使 0 場比賽）
  let leaguesFetched = 0;
  try {
    for (let i = 0; i < leagues.length; i++) {
      const el = document.getElementById('fetch-status');
      if (!isLeagueInSeason(leagues[i].psId, currentDate)) {
        console.log(`[SPORTIQ] ${leagues[i].name}: 非賽季，跳過`);
        continue;
      }
      if (el) el.textContent = `正在讀取 ${leagues[i].name}（${i+1}/${leagues.length}）...`;
      try {
        const result = await fetchFromPlaysport(leagues[i].psId, currentDate);
        psMatches = psMatches.concat(result);
        playsportReached = true; // 成功取得回應（不管有沒有比賽）
        leaguesFetched++;
        console.log(`[SPORTIQ] ${leagues[i].name}: ${result.length} 場賽事`);
      } catch(e) { console.warn(`[${leagues[i].name}] fetch error:`, e); }
    }
  } catch(e) { console.warn('playsport fetch error:', e); }

  // 檢查是否所有聯賽都不在賽季內
  const allOffSeason = leagues.length > 0 && leagues.every(l => !isLeagueInSeason(l.psId, currentDate));

  if (psMatches.length > 0) {
    allMatches = psMatches;
    dataSource = 'playsport';
  } else if (allOffSeason) {
    // 所有聯賽都是休賽期，不需要備援
    allMatches = [];
    dataSource = 'offseason';
    console.log(`[SPORTIQ] ${currentSport}: 所有聯賽均為休賽期`);
  } else if (playsportReached) {
    // playsport 成功連線但今天確實沒有比賽，不使用備援
    allMatches = [];
    dataSource = 'playsport';
    console.log(`[SPORTIQ] ${currentSport}: playsport 回傳 0 場（已成功爬取 ${leaguesFetched} 個聯賽）`);
  } else {
    // playsport 完全無法連線，才使用 TheSportsDB 備援
    const el = document.getElementById('fetch-status');
    if (el) el.textContent = 'playsport.cc 無法連線，改用 TheSportsDB...';
    try {
      allMatches = await fetchFromTSDB();
      dataSource = 'tsdb';
    } catch(e) {
      console.warn('TSDB fetch error:', e);
      dataSource = 'none';
    }
  }

  // 額外抓取 predict 盤口數據並合併
  if (allMatches.length > 0 && useLocalProxy) {
    const fetchedLeagues = [...new Set(allMatches.map(m => m.leagueId))];
    for (const lid of fetchedLeagues) {
      try {
        const pResp = await fetch(`${LOCAL_PROXY}/predict?allianceid=${lid}`, { signal: AbortSignal.timeout(12000) });
        if (pResp.ok) {
          const pData = await pResp.json();
          if (pData.success && pData.games) {
            for (const pg of pData.games) {
              // 用隊名配對
              const matched = allMatches.find(m => m.leagueId === lid &&
                ((t(m.away).includes(pg.away) || pg.away.includes(t(m.away))) &&
                 (t(m.home).includes(pg.home) || pg.home.includes(t(m.home)))));
              if (matched) {
                matched.predict = pg.predict;
                // 如果 predict 有更完整的賠率，補充到 odds
                if (!matched.odds) matched.odds = {};
                if (pg.predict.bankML && pg.predict.bankML.odds) {
                  matched.odds.mlHome = pg.predict.bankML.odds;
                }
                if (pg.predict.bankML2 && pg.predict.bankML2.odds) {
                  matched.odds.mlAway = pg.predict.bankML2.odds;
                }
              }
            }
            console.log(`[PREDICT] merged ${pData.games.length} predict games for league ${lid}`);
          }
        }
      } catch(e) { console.warn(`[PREDICT] ${lid} error:`, e.message); }
    }
  }

  // 排序
  const statusOrder = { live: 0, upcoming: 1, postponed: 2, finished: 3 };
  allMatches.sort((a, b) => {
    const sa = statusOrder[a.status] ?? 9, sb = statusOrder[b.status] ?? 9;
    if (sa !== sb) return sa - sb;
    const da = new Date(a.date + 'T' + (a.time || '00:00'));
    const db = new Date(b.date + 'T' + (b.time || '00:00'));
    return a.status === 'finished' ? db - da : da - db;
  });

  renderMatchList();
  updateTicker();
  startCountdown();

  // 顯示資料來源
  console.log(`[SPORTIQ] 資料來源: ${dataSource}, 共 ${allMatches.length} 場賽事`);
}

/* ========== 節比分 ========== */
function genQuarterScores(m) {
  // 如果有真實節比分資料（來自 playsport.cc proxy）
  if (m.quarterScores) {
    try {
      const qs = m.quarterScores;
      // 新格式：{ away: [28, 30, ...], home: [25, 33, ...] }
      if (qs.home && qs.away && qs.home.length > 0) {
        return { hq: qs.home, aq: qs.away, periods: qs.home.length };
      }
      // 舊格式：陣列
      if (Array.isArray(qs) && qs.length > 0) {
        const hq = qs.map(q => q.home ?? q[0] ?? 0);
        const aq = qs.map(q => q.away ?? q[1] ?? 0);
        return { hq, aq, periods: qs.length };
      }
    } catch(e) { /* fallback to simulated */ }
  }

  if (m.homeScore === null || m.homeScore === undefined) return null;
  const hs = parseInt(m.homeScore), as = parseInt(m.awayScore);
  if (isNaN(hs) || isNaN(as)) return null;
  const seed = hashCode(m.id || m.home + m.away);
  const isBball = currentSport === 'basketball';
  const isSoccer = currentSport === 'soccer';
  const periods = isBball ? 4 : isSoccer ? 2 : 9;
  const hq = [], aq = [];
  let hRemain = hs, aRemain = as;
  for (let i = 0; i < periods - 1; i++) {
    const hVal = isBball
      ? Math.min(hRemain, Math.max(15, 20 + ((seed >> (i*3)) % 16) - 8))
      : Math.min(hRemain, (seed >> (i*2)) % (isSoccer ? 3 : 4));
    const aVal = isBball
      ? Math.min(aRemain, Math.max(15, 20 + ((seed >> (i*3+1)) % 16) - 8))
      : Math.min(aRemain, (seed >> (i*2+1)) % (isSoccer ? 3 : 4));
    hq.push(Math.min(hVal, hRemain));
    aq.push(Math.min(aVal, aRemain));
    hRemain -= hq[i]; aRemain -= aq[i];
  }
  hq.push(Math.max(0, hRemain)); aq.push(Math.max(0, aRemain));
  return { hq, aq, periods };
}

/* ========== AI 快速推薦（基於讓分盤口）========== */
/* 核心原則：推薦內容完全由不可變資料（隊名、日期、盤口）決定，
   賽前賽後結果完全一致，不會因比分出現而改變推薦。 */

// 產生固定推薦（不依賴比分，只用 immutable 資料）
function _computePrediction(m) {
  const odds = m.odds || {};
  const spread = parseFloat(odds.spread);
  const hasSpread = !isNaN(spread) && spread !== 0;
  const homeName = t(m.home), awayName = t(m.away);
  // 固定 seed：只基於原始隊名（非翻譯後）+ 日期，確保不可變
  const seed = Math.abs(hashCode(m.home + m.away + (m.date || ''))) % 100;

  if (hasSpread) {
    // spread > 0 = 主隊讓分（主隊強）; spread < 0 = 客隊讓分（客隊強）
    const absSpread = Math.abs(spread);
    const favTeam = spread > 0 ? homeName : awayName;
    const dogTeam = spread > 0 ? awayName : homeName;
    const favIsHome = spread > 0;
    // 用 seed + 盤口大小決定推薦方向，不依賴 generateAnalysis
    let pickFav;
    if (absSpread >= 10) pickFav = seed < 35;       // 大讓分偏受讓
    else if (absSpread >= 6) pickFav = seed < 45;
    else if (absSpread >= 3) pickFav = seed < 55;
    else pickFav = seed < 60;                         // 小讓分偏讓分方

    if (pickFav) {
      return { prediction: `${favTeam} 讓${absSpread}`, favIsHome, absSpread, type: 'spread-fav',
        color: 'text-emerald-400', bg: 'bg-emerald-900/20' };
    } else {
      return { prediction: `${dogTeam} 受讓${absSpread}`, favIsHome, absSpread, type: 'spread-dog',
        color: 'text-blue-400', bg: 'bg-blue-900/20' };
    }
  }

  // 無盤口：參考過往比賽紀錄來判斷（適用所有賽事包含 WBC）
  const rec = m.record || {};
  let homeScore = 0, awayScore = 0; // 實力評分（非比分）

  // 1. 戰績（如 "主22-11" → 勝率 66%）
  const parseWL = (s) => { const m2 = (s||'').match(/(\d+)\s*-\s*(\d+)/); return m2 ? [parseInt(m2[1]), parseInt(m2[2])] : null; };
  const hWL = parseWL(rec.homeRecord), aWL = parseWL(rec.awayRecord);
  if (hWL && aWL) {
    const hPct = hWL[0] / (hWL[0] + hWL[1] + 0.01);
    const aPct = aWL[0] / (aWL[0] + aWL[1] + 0.01);
    homeScore += (hPct - aPct) * 30;
  }

  // 2. 近十場（如 "40-23" → 勝率 63%）
  const hRecent = parseWL(rec.homeRecent), aRecent = parseWL(rec.awayRecent);
  if (hRecent && aRecent) {
    const hRPct = hRecent[0] / (hRecent[0] + hRecent[1] + 0.01);
    const aRPct = aRecent[0] / (aRecent[0] + aRecent[1] + 0.01);
    homeScore += (hRPct - aRPct) * 20;
  }

  // 3. 平均得失分（如 "116.4 / 112" → 淨勝 +4.4）
  const parseAvg = (s) => { const m2 = (s||'').match(/([\d.]+)\s*\/\s*([\d.]+)/); return m2 ? { scored: parseFloat(m2[1]), allowed: parseFloat(m2[2]) } : null; };
  const hAvg = parseAvg(rec.homeAvg), aAvg = parseAvg(rec.awayAvg);
  if (hAvg && aAvg) {
    const hNet = hAvg.scored - hAvg.allowed;
    const aNet = aAvg.scored - aAvg.allowed;
    homeScore += (hNet - aNet) * 2;
  }

  // 4. 對戰紀錄（如 "8-2, 5連勝"）
  const hH2H = parseWL(rec.homeH2H), aH2H = parseWL(rec.awayH2H);
  if (hH2H && aH2H) {
    const hPct = hH2H[0] / (hH2H[0] + hH2H[1] + 0.01);
    const aPct = aH2H[0] / (aH2H[0] + aH2H[1] + 0.01);
    homeScore += (hPct - aPct) * 10;
  }

  // 5. 近十場平均得失分（如 "5.2 / 3.8"）— 反映近期攻防火力
  const hRecentAvg = parseAvg(rec.homeRecentAvg), aRecentAvg = parseAvg(rec.awayRecentAvg);
  if (hRecentAvg && aRecentAvg) {
    const hNet = hRecentAvg.scored - hRecentAvg.allowed;
    const aNet = aRecentAvg.scored - aRecentAvg.allowed;
    homeScore += (hNet - aNet) * 3;
  }

  // 6. 主客場戰績（如 "15-8" vs "10-14"）— 主場龍/客場蟲效應
  const hHA = parseWL(rec.homeHomeAway), aHA = parseWL(rec.awayHomeAway);
  if (hHA && aHA) {
    const hHAPct = hHA[0] / (hHA[0] + hHA[1] + 0.01);
    const aHAPct = aHA[0] / (aHA[0] + aHA[1] + 0.01);
    homeScore += (hHAPct - aHAPct) * 15;
  }

  // 7. 主場基本優勢加成（所有運動主場都有微幅優勢）
  homeScore += 2;

  // 根據實力評分決定推薦
  const diff = homeScore;
  const absDiff = Math.abs(diff);
  const hasRecordData = !!(hWL || aWL || hRecent || aRecent || hAvg || aAvg || hH2H || aH2H || hRecentAvg || aRecentAvg || hHA || aHA);

  // 完全無數據：用 seed 產生固定推薦（避免全部觀望）
  if (!hasRecordData) {
    const pickHome = seed < 50;
    const fTeam = pickHome ? homeName : awayName;
    const fColor = pickHome ? 'text-emerald-400' : 'text-blue-400';
    const fBg = pickHome ? 'bg-emerald-900/20' : 'bg-blue-900/20';
    return { prediction: `獨贏 ${fTeam}`, favIsHome: pickHome, absSpread: 0, type: 'moneyline',
      color: fColor, bg: fBg };
  }

  const homeStrong = diff > 0;
  const favTeam = homeStrong ? homeName : awayName;
  const favIsHome = homeStrong;
  const favColor = homeStrong ? 'text-emerald-400' : 'text-blue-400';
  const favBg = homeStrong ? 'bg-emerald-900/20' : 'bg-blue-900/20';

  if (absDiff < 1) {
    // 有數據但差距極小 → 觀望
    return { prediction: '觀望', favIsHome: true, absSpread: 0, type: 'skip',
      color: 'text-gray-400', bg: 'bg-gray-800/30' };
  }
  // 有明顯差距 → 獨贏推薦
  return { prediction: `獨贏 ${favTeam}`, favIsHome, absSpread: 0, type: 'moneyline',
    color: favColor, bg: favBg };
}

function getAITip(m) {
  const pred = _computePrediction(m);
  const homeName = t(m.home), awayName = t(m.away);

  if (m.status === 'finished') {
    const hs = parseInt(m.homeScore), as = parseInt(m.awayScore);
    const hasScore = !isNaN(hs) && !isNaN(as);
    if (!hasScore) return { label: '已結束', color: 'text-gray-500', bg: 'bg-gray-800/30' };

    const scoreDiff = hs - as;
    const winTeam = scoreDiff > 0 ? homeName : scoreDiff < 0 ? awayName : '平局';
    const resultText = scoreDiff === 0 ? '平局' : `${winTeam}勝 ${hs}:${as}`;

    // 判斷推薦是否正確
    let isCorrect = null;
    if (pred.type === 'moneyline') {
      isCorrect = pred.favIsHome ? scoreDiff > 0 : scoreDiff < 0;
    } else if (pred.type === 'spread-fav' || pred.type === 'vspread-fav') {
      // 讓分方需贏超過讓分數
      isCorrect = pred.favIsHome ? (scoreDiff > pred.absSpread) : (-scoreDiff > pred.absSpread);
    } else if (pred.type === 'spread-dog' || pred.type === 'vspread-dog') {
      // 受讓方：不輸超過讓分即算贏
      isCorrect = pred.favIsHome ? (-scoreDiff > -pred.absSpread) : (scoreDiff > -pred.absSpread);
    }
    // type === 'skip' → isCorrect stays null

    const mark = isCorrect === null ? '' : isCorrect ? ' ✓' : ' ✗';
    const markColor = isCorrect === null ? 'text-gray-400' : isCorrect ? 'text-emerald-400' : 'text-red-400';
    const markBg = isCorrect === null ? 'bg-gray-800/30' : isCorrect ? 'bg-emerald-900/20' : 'bg-red-900/20';

    return { label: pred.prediction + mark, result: resultText, color: markColor, bg: markBg };
  }

  // 未開始 / 進行中：直接回傳固定推薦
  return { label: pred.prediction, color: pred.color, bg: pred.bg };
}

// 聯賽圖標對照
const LEAGUE_ICONS = {
  '3': '🏀', '8': '🏀', '89': '🏀', '92': '🏀', '97': '🏀',
  '114': '⚾', '1': '⚾', '2': '⚾', '6': '⚾', '9': '⚾',
  '4': '⚽', '91': '🏒', '21': '🎾',
};

/* ========== 渲染賽事列表 ========== */
function renderMatchList() {
  const container = document.getElementById('match-list');
  const leagues = SPORT_LEAGUES[currentSport] || [];
  let filtered = allMatches;

  // 狀態篩選
  if (currentFilter !== 'all') {
    filtered = filtered.filter(m => m.status === currentFilter);
  }
  // 日期篩選（playsport 資料已經是當天的，TSDB 需要篩選）
  if (dataSource === 'tsdb') {
    filtered = filtered.filter(m => m.date === currentDate);
  }

  // 聯賽篩選
  if (currentLeague !== 'all') {
    filtered = filtered.filter(m => m.leagueId === currentLeague);
  }

  document.getElementById('match-count').textContent = filtered.length;

  // 按聯賽分組
  const groups = {};
  filtered.forEach(m => {
    const key = m.leagueId || m.league;
    if (!groups[key]) groups[key] = { name: m.league, matches: [] };
    groups[key].matches.push(m);
  });

  // 構建所有聯賽列表（含沒賽事的）
  let html = '';
  const shownLeagues = new Set();

  // 先渲染有賽事的聯賽
  for (const [key, group] of Object.entries(groups)) {
    shownLeagues.add(key);
    html += renderLeagueSection(group.name, key, group.matches);
  }

  // 再渲染沒有賽事的聯賽（顯示 0）
  if (currentLeague === 'all') {
    for (const l of leagues) {
      if (!shownLeagues.has(l.psId)) {
        html += renderLeagueSection(l.name, l.psId, []);
      }
    }
  }

  if (html === '') {
    const sportName = {'basketball':'籃球','wbc':'WBC經典賽','baseball':'棒球','soccer':'足球','hockey':'冰球','tennis':'網球'}[currentSport] || '';
    html = `<div class="flex items-center justify-center py-16 text-center">
      <div>
        <p class="text-2xl mb-3">📭</p>
        <p class="text-sm font-bold text-gray-500 mb-1">${fmtDate(currentDate)} ${sportName} 今日無賽事</p>
        <p class="text-xs text-gray-700">請切換日期或運動類型</p>
      </div>
    </div>`;
  }

  container.innerHTML = html;
  if (window.lucide) window.lucide.createIcons();
}

const collapsedLeagues = new Set();
function toggleLeague(leagueId) {
  if (collapsedLeagues.has(leagueId)) collapsedLeagues.delete(leagueId);
  else collapsedLeagues.add(leagueId);
  renderMatchList();
}

function renderLeagueSection(leagueName, leagueId, matches) {
  const icon = LEAGUE_ICONS[leagueId] || '🏆';
  const count = matches.length;
  const isCollapsed = collapsedLeagues.has(leagueId);
  const chevronCls = isCollapsed ? 'collapsed' : '';

  const sectionCls = (count === 0 || isCollapsed) ? 'collapsed-section' : 'has-body';
  let html = `<div class="league-section ${sectionCls}">
    <div class="league-bar" onclick="toggleLeague('${leagueId}')">
      <span class="league-icon">${icon}</span>
      <span class="league-name">${leagueName}</span>
      <span class="league-count">${count}</span>
      <span class="league-chevron ${chevronCls}">▼</span>
    </div>`;

  if (count === 0 || isCollapsed) {
    html += `</div>`;
    return html;
  }

  // 表頭
  html += `<div class="league-body"><div style="overflow-x:auto"><table class="game-table"><thead><tr>
    <th class="th-team">客隊 / 主隊</th>
    <th>最終得分</th>
    <th>讓分盤</th>
    <th>勝率</th>
    <th>期望值</th>
    <th>賠率</th>
    <th>AI推薦</th>
    <th>是否過關</th>
  </tr></thead><tbody>`;

  // 按日期+時間分組
  let lastDate = '';
  for (const m of matches) {
    const dateKey = m.date + ' ' + (m.time ? m.time.slice(0,5) : '');
    if (dateKey !== lastDate) {
      const timeStr = m.time ? m.time.slice(0,5) : '';
      let statusLabel = '';
      if (m.status === 'live') statusLabel = `<span style="color:#ef4444;font-weight:800">LIVE</span>`;
      else if (m.status === 'finished') statusLabel = `<span style="color:#64748b">已結束</span>`;
      else if (m.status === 'upcoming') statusLabel = `<span style="color:#3b82f6">未開始</span>`;
      html += `<tr class="date-row"><td colspan="8">${m.date.slice(5)} ${timeStr} ${statusLabel}</td></tr>`;
      lastDate = dateKey;
    }

    const tip = getAITip(m);
    const pred = _computePrediction(m);
    const hasScore = m.homeScore !== null && m.homeScore !== undefined;
    const isLive = m.status === 'live';
    const odds = m.odds || {};
    const spread = odds.spread ? parseFloat(odds.spread) : NaN;
    const hasSpread = !isNaN(spread) && spread !== 0;

    // 讓分盤顯示
    const absSpread = hasSpread ? Math.abs(spread) : 0;
    const spreadSide = hasSpread ? (spread > 0 ? '主' : '客') : '';
    const spreadSign = hasSpread ? (spread > 0 ? '+' : '-') : '';

    // 勝率計算
    const analysis = generateAnalysis(m);
    const homeWin = analysis.homeWin || 50;
    const awayWin = analysis.awayWin || 50;

    // 期望值（簡單計算：勝率 × 賠率 - 1）
    let mlOdds = 0;
    if (odds.mlHome) mlOdds = parseFloat(odds.mlHome);
    else if (odds.spreadOddsHome) mlOdds = parseFloat(odds.spreadOddsHome);
    else if (odds.spreadOdds) mlOdds = parseFloat(odds.spreadOdds);
    // predict 合併的賠率
    if ((!mlOdds || mlOdds <= 0) && m.predict) {
      const bp = m.predict.bankML || {};
      if (bp.odds) mlOdds = parseFloat(bp.odds);
    }
    // spreadOdds 可能是百分比格式(如 "-50", "50")，轉為十進位賠率
    if (mlOdds && Math.abs(mlOdds) > 10) mlOdds = 0; // 非十進位賠率，忽略
    if (!mlOdds || mlOdds <= 0) mlOdds = 1.9; // 預設
    const favWin = pred.favIsHome ? homeWin : awayWin;
    const ev = ((favWin / 100) * mlOdds - 1) * 100;

    // AI推薦
    let tipClass = 'tip-pending';
    if (m.status === 'finished') {
      if (tip.color.includes('emerald')) tipClass = 'tip-win';
      else if (tip.color.includes('red')) tipClass = 'tip-loss';
      else tipClass = 'tip-skip';
    } else if (tip.label === '觀望') {
      tipClass = 'tip-skip';
    }

    // 是否過關（已結束才顯示）
    let resultIcon = '';
    if (m.status === 'finished' && tip.label) {
      if (tip.label.includes('✓')) resultIcon = `<span class="result-circle pass">✓</span>`;
      else if (tip.label.includes('✗')) resultIcon = `<span class="result-circle fail"></span>`;
      else resultIcon = `<span class="result-circle none"></span>`;
    } else if (m.status === 'upcoming' || m.status === 'live') {
      resultIcon = `<span class="result-circle none"></span>`;
    }

    // 客隊行
    const awayWinner = hasScore && parseInt(m.awayScore) > parseInt(m.homeScore);
    const homeWinner = hasScore && parseInt(m.homeScore) > parseInt(m.awayScore);
    const scoreColor = isLive ? 'color:#ef4444' : '';

    html += `<tr class="row-away" onclick="toggleExpand('${m.id}')">
      <td class="td-team">
        <div class="flex items-center gap-1.5">
          <span style="font-size:9px;font-weight:700;color:#60a5fa;background:rgba(59,130,246,.15);padding:1px 4px;border-radius:3px">客</span>
          <span style="${awayWinner ? 'color:#fff' : 'color:#cbd5e1'}">${t(m.away)}</span>
        </div>
      </td>
      <td class="td-score" style="${scoreColor}${awayWinner ? ';color:#fff' : ''}">${hasScore ? m.awayScore : '-'}</td>
      <td class="td-spread">${hasSpread ? `<span class="spread-val">${spread < 0 ? '-' + absSpread : '+' + absSpread}</span>` : ''}</td>
      <td><span class="pct-val">${awayWin}%</span></td>
      <td rowspan="2" style="vertical-align:middle"><span class="${ev > 0 ? 'text-emerald-400' : ev < -10 ? 'text-red-400' : 'text-gray-500'}" style="font-size:12px;font-weight:700">${ev > 0 ? '+' : ''}${ev.toFixed(0)}</span></td>
      <td rowspan="2" style="vertical-align:middle"><span class="odds-val">${mlOdds.toFixed(1)}</span></td>
      <td rowspan="2" style="vertical-align:middle"><span class="ai-tip ${tipClass}">${tip.label.replace(/\s*[✓✗]$/, '')}</span></td>
      <td rowspan="2" style="vertical-align:middle">${resultIcon}</td>
    </tr>`;

    // 主隊行
    const isExpanded = expandedId === m.id;
    html += `<tr class="row-home" onclick="toggleExpand('${m.id}')">
      <td class="td-team">
        <div class="flex items-center gap-1.5">
          <span style="font-size:9px;font-weight:700;color:#f87171;background:rgba(239,68,68,.12);padding:1px 4px;border-radius:3px">主</span>
          <span style="${homeWinner ? 'color:#fff' : 'color:#cbd5e1'}">${t(m.home)}</span>
        </div>
      </td>
      <td class="td-score" style="${scoreColor}${homeWinner ? ';color:#fff' : ''}">${hasScore ? m.homeScore : '-'}</td>
      <td class="td-spread">${hasSpread ? `<span class="spread-val">${spread > 0 ? '-' + absSpread : '+' + absSpread}</span>` : ''}</td>
      <td><span class="pct-val">${homeWin}%</span></td>
    </tr>`;

    // 展開面板行
    if (isExpanded) {
      html += `<tr><td colspan="8" style="padding:0;border-top:1px solid #1e293b">${renderExpandedPanel(m)}</td></tr>`;
    }
  }

  html += `</tbody></table></div></div></div>`;
  return html;
}

/* ========== AI 分析引擎 ========== */
function parseRecord(str) {
  // 解析多種格式："30勝25敗" / "33 - 19" / "客12 - 13" / "1-1" / "8 - 2 , 5連勝"
  if (!str) return null;
  // 格式1: X勝Y敗
  let m = str.match(/(\d+)\s*勝\s*(\d+)\s*敗/);
  if (m) { const w=parseInt(m[1]),l=parseInt(m[2]); return { w, l, total:w+l, pct:(w/(w+l)*100).toFixed(1) }; }
  // 格式2: X - Y（可能前面有「主」「客」等字）
  m = str.match(/(\d+)\s*[-–]\s*(\d+)/);
  if (m) { const w=parseInt(m[1]),l=parseInt(m[2]); return { w, l, total:w+l, pct: (w+l)>0?(w/(w+l)*100).toFixed(1):'0' }; }
  return null;
}

function parseAvgScore(str) {
  // 解析 "113.5 / 108.2" 格式（得分/失分）
  if (!str) return null;
  const m = str.match(/([\d.]+)\s*\/\s*([\d.]+)/);
  if (m) return { scored: parseFloat(m[1]), allowed: parseFloat(m[2]) };
  return null;
}

function generateAnalysis(m) {
  const isBball = currentSport === 'basketball';
  let homeWin = 45, draw = isBball ? 0 : 25, awayWin = isBball ? 55 : 30;
  let confidence = 50, totalGoals = '2-3';
  const rec = m.record || {};
  const odds = m.odds || {};
  const spread = parseFloat(odds.spread);
  const hasSpread = !isNaN(spread) && spread !== 0;
  const homeName = t(m.home), awayName = t(m.away);

  // 解析戰績數據
  const homeRec = parseRecord(rec.homeRecord);
  const awayRec = parseRecord(rec.awayRecord);
  const homeRecent = parseRecord(rec.homeRecent);
  const awayRecent = parseRecord(rec.awayRecent);
  const homeAvg = parseAvgScore(rec.homeAvg);
  const awayAvg = parseAvgScore(rec.awayAvg);
  const homeHA = parseRecord(rec.homeHomeAway);
  const awayHA = parseRecord(rec.awayHomeAway);

  // ===== 已結束 =====
  if (m.status === 'finished' && m.homeScore !== null && m.awayScore !== null) {
    const hs = parseInt(m.homeScore), as = parseInt(m.awayScore);
    const diff = hs - as;
    const winner = diff > 0 ? homeName : awayName;
    const loser = diff > 0 ? awayName : homeName;
    const margin = Math.abs(diff);

    let lines = [];
    lines.push(`本場比賽由 ${winner} 以 ${Math.max(hs,as)}:${Math.min(hs,as)} 擊敗 ${loser}，${margin >= 15 ? '大幅領先取得壓倒性勝利' : margin >= 8 ? '穩定發揮拉開差距' : '雙方纏鬥至終場'}。`);

    if (hasSpread) {
      const favTeam = spread > 0 ? homeName : awayName;
      const absSpread = Math.abs(spread);
      const covered = spread > 0 ? (diff > spread) : (diff < spread);
      lines.push(`盤口方面，${favTeam} 讓 ${absSpread} 分，${covered ? '成功過盤' : '未能過盤'}。`);
    }

    homeWin = diff > 0 ? 70 : 25;
    awayWin = isBball ? (100 - homeWin) : (diff < 0 ? 60 : 20);
    draw = isBball ? 0 : (100 - homeWin - awayWin);
    confidence = 90;
    const total = homeWin + draw + awayWin;
    homeWin = Math.round(homeWin/total*100); awayWin = Math.round(awayWin/total*100); draw = 100-homeWin-awayWin;
    return { homeWin, draw, awayWin, suggestion: lines.join(''), totalGoals, confidence };
  }

  // ===== 進行中 =====
  if (m.status === 'live') {
    const hs = parseInt(m.homeScore||0), as = parseInt(m.awayScore||0);
    const diff = hs - as;
    let lines = [];
    if (diff > 0) lines.push(`比賽進行中，${homeName} 以 ${hs}:${as} 領先 ${Math.abs(diff)} 分，掌握場上主動權。`);
    else if (diff < 0) lines.push(`比賽進行中，${awayName} 以 ${as}:${hs} 領先 ${Math.abs(diff)} 分，客場表現強勢。`);
    else lines.push(`比賽進行中，雙方 ${hs}:${as} 戰成平手，比賽膠著。`);
    homeWin = diff > 0 ? 62 : diff < 0 ? 35 : 48;
    awayWin = isBball ? (100 - homeWin) : (diff < 0 ? 55 : 30);
    draw = isBball ? 0 : (100 - homeWin - awayWin);
    confidence = 55;
    const total = homeWin + draw + awayWin;
    homeWin = Math.round(homeWin/total*100); awayWin = Math.round(awayWin/total*100); draw = 100-homeWin-awayWin;
    return { homeWin, draw, awayWin, suggestion: lines.join(''), totalGoals, confidence };
  }

  // ===== 賽前分析（核心） =====
  let lines = [];
  let homeAdj = 0, awayAdj = 0;

  // 1. 整體戰績分析
  if (homeRec && awayRec) {
    const hPct = parseFloat(homeRec.pct), aPct = parseFloat(awayRec.pct);
    lines.push(`【整體戰績】${homeName}（${homeRec.w}勝${homeRec.l}敗，勝率 ${hPct}%）vs ${awayName}（${awayRec.w}勝${awayRec.l}敗，勝率 ${aPct}%）。`);
    if (hPct - aPct > 15) { lines.push(`${homeName} 整體戰績明顯優於對手，具備較強的陣容深度與穩定性。`); homeAdj += 8; }
    else if (aPct - hPct > 15) { lines.push(`${awayName} 本季表現更為出色，整體實力佔優。`); awayAdj += 8; }
    else { lines.push(`兩隊本季戰績相近，實力在伯仲之間。`); }
  }

  // 2. 近況分析
  if (homeRecent && awayRecent) {
    const hR = parseInt(homeRecent.w), aR = parseInt(awayRecent.w);
    lines.push(`【近期狀態】${homeName} 近十場 ${homeRecent.w}勝${homeRecent.l}敗；${awayName} 近十場 ${awayRecent.w}勝${awayRecent.l}敗。`);
    if (hR >= 7) { lines.push(`${homeName} 近期手感火燙，處於連勝節奏中。`); homeAdj += 5; }
    else if (hR <= 3) { lines.push(`${homeName} 近況低迷，需留意狀態調整。`); awayAdj += 3; }
    if (aR >= 7) { lines.push(`${awayName} 近期狀態極佳，客場作戰信心充足。`); awayAdj += 5; }
    else if (aR <= 3) { lines.push(`${awayName} 近期表現不穩，客場挑戰難度加大。`); homeAdj += 3; }
  }

  // 3. 主客場戰績
  if (homeHA && awayHA) {
    lines.push(`【主客場】${homeName} 主場 ${homeHA.w}勝${homeHA.l}敗；${awayName} 客場 ${awayHA.w}勝${awayHA.l}敗。`);
    const hHA = parseFloat(homeHA.pct), aHA = parseFloat(awayHA.pct);
    if (hHA > 60) { lines.push(`${homeName} 主場勝率突出，主場龍優勢不容忽視。`); homeAdj += 4; }
    if (aHA < 40) { lines.push(`${awayName} 客場戰績不佳，客場蟲劣勢明顯。`); homeAdj += 3; }
    else if (aHA > 55) { lines.push(`${awayName} 客場表現穩健，具備客場搶分能力。`); awayAdj += 3; }
  }

  // 4. 得失分分析
  if (homeAvg && awayAvg) {
    lines.push(`【攻防數據】${homeName} 場均得 ${homeAvg.scored} 失 ${homeAvg.allowed} 分；${awayName} 場均得 ${awayAvg.scored} 失 ${awayAvg.allowed} 分。`);
    const hNet = homeAvg.scored - homeAvg.allowed;
    const aNet = awayAvg.scored - awayAvg.allowed;
    if (hNet > 5 && aNet < -3) lines.push(`${homeName} 攻守兩端均佔優勢，淨勝分差距顯著。`);
    else if (aNet > 5 && hNet < -3) lines.push(`${awayName} 攻防效率更高，數據面具有明顯優勢。`);
    else if (homeAvg.scored > awayAvg.scored + 5) lines.push(`${homeName} 進攻火力更強，場均得分領先對手。`);
    else if (awayAvg.scored > homeAvg.scored + 5) lines.push(`${awayName} 進攻端更具威脅，得分能力佔優。`);

    if (isBball) {
      const expectedTotal = (homeAvg.scored + awayAvg.scored + homeAvg.allowed + awayAvg.allowed) / 2;
      if (expectedTotal > 225) lines.push(`預計本場節奏偏快，大分機率較高（預估總分 ${expectedTotal.toFixed(0)} 分上下）。`);
      else if (expectedTotal < 210) lines.push(`雙方防守強度較高，小分值得關注（預估總分 ${expectedTotal.toFixed(0)} 分上下）。`);
    }
  }

  // 4b. 近十場平均得失分（近期火力趨勢）
  const homeRecentAvg = parseAvgScore(rec.homeRecentAvg);
  const awayRecentAvg = parseAvgScore(rec.awayRecentAvg);
  if (homeRecentAvg && awayRecentAvg) {
    lines.push(`【近期火力】${homeName} 近十場場均得 ${homeRecentAvg.scored} 失 ${homeRecentAvg.allowed} 分；${awayName} 近十場場均得 ${awayRecentAvg.scored} 失 ${awayRecentAvg.allowed} 分。`);
    const hNet = homeRecentAvg.scored - homeRecentAvg.allowed;
    const aNet = awayRecentAvg.scored - awayRecentAvg.allowed;
    if (hNet > aNet + 3) { lines.push(`${homeName} 近期攻防效率明顯優於對手，狀態正佳。`); homeAdj += 5; }
    else if (aNet > hNet + 3) { lines.push(`${awayName} 近期火力更旺，攻防兩端表現搶眼。`); awayAdj += 5; }
    else { lines.push(`兩隊近期攻防數據接近，短期狀態相當。`); }
  }

  // 5. 盤口分析
  if (hasSpread) {
    const favTeam = spread > 0 ? homeName : awayName;
    const dogTeam = spread > 0 ? awayName : homeName;
    const absSpread = Math.abs(spread);
    lines.push(`【盤口解讀】本場開出 ${favTeam} 讓 ${absSpread} 分，`);
    if (absSpread >= 10) lines[lines.length-1] += `讓分幅度較大，盤口看好 ${favTeam} 大勝。建議留意 ${dogTeam} 是否具備爆冷實力。`;
    else if (absSpread >= 5) lines[lines.length-1] += `屬於中等讓分，${favTeam} 被看好但需穩定發揮方能過盤。`;
    else lines[lines.length-1] += `讓分較小，反映兩隊實力差距不大，比賽懸念較高。`;

    if (spread > 0) homeAdj += Math.min(10, absSpread);
    else awayAdj += Math.min(10, absSpread);
  }

  // 6. 對戰紀錄
  if (rec.homeH2H || rec.awayH2H) {
    const h2hHome = parseRecord(rec.homeH2H);
    const h2hAway = parseRecord(rec.awayH2H);
    if (h2hHome && h2hAway) {
      lines.push(`【歷史交鋒】${homeName} ${h2hHome.w}勝${h2hHome.l}敗 vs ${awayName} ${h2hAway.w}勝${h2hAway.l}敗。`);
      if (h2hHome.w > h2hAway.w + 2) { lines.push(`${homeName} 在歷史對戰中佔據心理優勢。`); homeAdj += 3; }
      else if (h2hAway.w > h2hHome.w + 2) { lines.push(`${awayName} 在交手紀錄中更勝一籌。`); awayAdj += 3; }
    }
  }

  // 如果沒有任何真實數據，給出基本分析
  if (lines.length === 0) {
    const seed = Math.abs(hashCode(m.home + m.away + (m.date || '')));
    const adj = (seed % 30) - 12; // -12 ~ +17，微偏主場
    homeAdj += adj > 0 ? adj : 0;
    awayAdj += adj < 0 ? -adj : 0;
    homeAdj += 3; // 主場基本優勢

    lines.push(`【基本面】本場比賽 ${homeName}（主）迎戰 ${awayName}（客）。`);
    lines.push(`主隊在自家球場擁有場地熟悉度與球迷支持的先天優勢。`);

    // 判斷是否為春訓/季前賽時期（2~3月）
    const monthNum = m.date ? parseInt(m.date.split('-')[1] || '0') : 0;
    if (currentSport === 'baseball' && (monthNum === 2 || monthNum === 3)) {
      lines.push(`【特別提醒】目前處於春訓期間，各隊以調整狀態、測試陣容為主，主力球員上場時間有限，比賽結果參考性較低。`);
      lines.push(`春訓勝負與正式賽季表現相關性不高，建議控制投注規模。`);
    } else {
      lines.push(`目前缺少詳細的戰績與盤口數據，建議關注兩隊近期傷病動態、先發陣容與輪休安排，綜合判斷後再做決策。`);
    }
  }

  // 7. 總結建議
  const totalAdj = homeAdj - awayAdj;
  if (totalAdj > 10) lines.push(`📌 綜合評估：${homeName} 各項數據全面佔優，本場值得看好主勝方向。`);
  else if (totalAdj > 4) lines.push(`📌 綜合評估：${homeName} 略佔優勢，可適度關注主勝，但需注意客隊反撲能力。`);
  else if (totalAdj < -10) lines.push(`📌 綜合評估：${awayName} 綜合實力更強，客勝方向值得重點關注。`);
  else if (totalAdj < -4) lines.push(`📌 綜合評估：${awayName} 稍佔上風，客場搶分機會較大。`);
  else lines.push(`📌 綜合評估：兩隊勢均力敵，比賽充滿變數，建議謹慎操作或觀望。`);

  // 計算勝率
  homeWin = 45 + homeAdj - awayAdj / 2;
  awayWin = 45 + awayAdj - homeAdj / 2;
  homeWin = Math.max(15, Math.min(80, homeWin));
  awayWin = Math.max(15, Math.min(80, awayWin));
  if (isBball) { draw = 0; const t2 = homeWin + awayWin; homeWin = Math.round(homeWin/t2*100); awayWin = 100 - homeWin; }
  else { draw = Math.max(5, 100 - homeWin - awayWin); const t2 = homeWin + draw + awayWin; homeWin = Math.round(homeWin/t2*100); awayWin = Math.round(awayWin/t2*100); draw = 100-homeWin-awayWin; }
  confidence = Math.min(85, Math.max(40, 50 + Math.abs(totalAdj) * 2));

  return { homeWin, draw, awayWin, suggestion: lines.join('\n'), totalGoals, confidence };
}

function generateForm(teamName) {
  const seed = hashCode(teamName);
  return Array.from({length:5}, (_,i) => { const v = (seed >> (i*3)) % 3; return v===0?'W':v===1?'D':'L'; });
}

function formBadge(f) {
  if (f==='W') return '<span class="w-6 h-6 rounded bg-emerald-600/30 text-emerald-400 flex items-center justify-center text-[10px] font-black border border-emerald-700/40">W</span>';
  if (f==='D') return '<span class="w-6 h-6 rounded bg-yellow-600/20 text-yellow-400 flex items-center justify-center text-[10px] font-black border border-yellow-700/30">D</span>';
  return '<span class="w-6 h-6 rounded bg-red-600/20 text-red-400 flex items-center justify-center text-[10px] font-black border border-red-700/30">L</span>';
}

/* ========== 切換 ========== */
function switchSport(sport) {
  currentSport = sport;
  currentLeague = 'all';
  expandedId = null;
  dateAvailCache = {};
  document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('tab-'+sport);
  if (el) el.classList.add('active');
  fetchAllData();
  checkDateAvailability();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebarMobile() {
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  }
}

function updateTicker() {
  const ticker = document.getElementById('ticker');
  if (!ticker) return;
  const liveOrDone = allMatches.filter(m => m.status === 'live' || (m.status === 'finished' && m.homeScore !== null));
  if (liveOrDone.length === 0) {
    const sportName = {'basketball':'籃球','wbc':'WBC經典賽','baseball':'棒球','soccer':'足球','hockey':'冰球','tennis':'網球'}[currentSport] || '';
    ticker.innerHTML = `<span class="ticker-item"><span class="text-gray-500">${sportName} — 暫無進行中的賽事</span></span><span class="ticker-item"><span class="text-gray-500">${sportName} — 暫無進行中的賽事</span></span>`;
    return;
  }
  const items = liveOrDone.map(m => {
    const isLive = m.status === 'live';
    return `<span class="ticker-item">${isLive ? '<span class="t-live">● LIVE</span>' : '<span class="text-gray-600">結束</span>'} <span>${t(m.home)}</span> <span class="t-score">${m.homeScore??'-'} : ${m.awayScore??'-'}</span> <span>${t(m.away)}</span></span>`;
  }).join('');
  ticker.innerHTML = items + items;
}

function setLeague(id) {
  currentLeague = id;
  renderLeagueTabs();
  renderMatchList();
}

function setFilter(filter) {
  currentFilter = filter;
  ['all','live','upcoming','finished','postponed'].forEach(f => {
    const el = document.getElementById('f-'+f);
    if (el) el.classList.toggle('active', f===filter);
  });
  renderMatchList();
}

function setDate(d) {
  currentDate = d;
  renderDateTabs();
  // playsport 資料是按日期爬取的，切換日期需要重新爬取
  fetchAllData();
}

/* ========== 初始化 ========== */
document.addEventListener('DOMContentLoaded', async function() {
  if (window.lucide) window.lucide.createIcons();
  await checkAuth();
});
</script>
